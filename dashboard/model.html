<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Model — Mushroom Wars v2</title>
  <link rel="stylesheet" href="lib/style.css">
  <style>
    /* Page-scoped styles for the model view. */
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .hero-grid .stat-block {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .hero-grid .stat-block .stat { font-size: 20px; line-height: 1.25; }

    .prose { max-width: 820px; }
    .prose p { margin: 0 0 12px; line-height: 1.55; }
    .prose p:last-child { margin-bottom: 0; }

    .feature-block + .feature-block { margin-top: 14px; }
    .feature-block header {
      display: flex; align-items: baseline; gap: 10px;
      border: none; padding: 0; margin-bottom: 6px;
    }
    .feature-block header .tag { margin-right: 4px; }
    .feature-block .desc { color: var(--fg-muted); font-size: 12px; margin-bottom: 8px; }
    .feature-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 4px 18px;
      font-size: 12px;
    }
    .feature-list .row { display: grid; grid-template-columns: 170px 1fr; gap: 10px; padding: 2px 0; }
    .feature-list .k { font-family: var(--mono); color: var(--accent); }
    .feature-list .v { color: var(--fg-muted); }

    .tag {
      display: inline-block; font-size: 10px; padding: 2px 7px;
      border-radius: 4px; letter-spacing: .4px; text-transform: uppercase; font-weight: 600;
    }
    .tag-input  { background: rgba(96,165,250,.15);  color: var(--accent); }
    .tag-body   { background: rgba(52,211,153,.15);  color: var(--accent-2); }
    .tag-head   { background: rgba(248,113,113,.18); color: var(--danger); }
    .tag-value  { background: rgba(251,191,36,.18);  color: #fbbf24; }
    .tag-embed  { background: rgba(167,139,250,.18); color: #a78bfa; }

    .net {
      display: flex; flex-direction: column; align-items: stretch; gap: 10px;
    }
    .net-row { display: flex; justify-content: center; align-items: stretch; gap: 12px; flex-wrap: wrap; }
    .net-arrow {
      color: var(--fg-muted); font-size: 18px; text-align: center;
      line-height: 1; padding: 2px 0;
    }
    .net-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      min-width: 170px;
      flex: 1 1 0;
      max-width: 260px;
    }
    .net-box.wide { max-width: 100%; flex: 1 1 100%; }
    .net-box header {
      display: flex; justify-content: space-between; align-items: center;
      border: none; padding: 0; margin: 0 0 6px;
    }
    .net-box header strong { font-size: 13px; }
    .layer-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: baseline;
      padding: 3px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 12px;
    }
    .layer-row:last-of-type { border-bottom: none; }
    .layer-row .lname { color: var(--fg); }
    .layer-row .lname .tname { color: var(--fg-muted); font-family: var(--mono); font-size: 11px; margin-left: 4px; }
    .layer-row .shape { font-family: var(--mono); color: var(--accent); font-size: 11px; }
    .layer-row .pcount { font-family: var(--mono); color: var(--fg-muted); font-size: 11px; }
    .net-box .foot {
      margin-top: 8px;
      font-size: 11px;
      color: var(--fg-muted);
      display: flex; justify-content: space-between; gap: 8px;
    }

    .output-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .output-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .output-card .shape { font-family: var(--mono); color: var(--accent); font-size: 13px; margin: 4px 0; }
    .output-card .desc { color: var(--fg-muted); font-size: 12px; line-height: 1.4; }

    details.raw-spec summary { cursor: pointer; color: var(--fg-muted); font-size: 12px; }
    details.raw-spec[open] summary { margin-bottom: 8px; }

    /* SVG architecture diagram */
    .arch-svg {
      width: 100%; height: auto; display: block;
      background: #0b0d12;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .arch-legend {
      display: flex; flex-wrap: wrap; gap: 8px 18px;
      margin-bottom: 12px; font-size: 12px; color: var(--fg-muted);
    }
    .arch-legend span { display: inline-flex; align-items: center; }
    .arch-legend .dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; margin-right: 6px;
    }
    .arch-legend .act-box {
      display: inline-block; width: 14px; height: 12px;
      background: #0b0d12; border: 1px solid var(--fg-muted);
      border-radius: 2px; margin-right: 6px;
    }
    .arch-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
      margin-top: 14px;
    }
    .arch-summary .block {
      background: #0b0d12;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
    }
    .arch-summary .block .title { font-size: 12px; font-weight: 600; }
    .arch-summary .block .shape { font-family: var(--mono); color: var(--accent); font-size: 11px; margin-top: 2px; }
    .arch-summary .block .params { font-family: var(--mono); color: var(--fg-muted); font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <h1>Mushroom Wars v2</h1>
    <nav>
      <a href="./index.html">Overview</a>
      <a href="./runs.html">Runs</a>
      <a href="./models.html">Models</a>
      <a href="./elo.html">Leaderboard</a>
      <a href="./training.html">Training</a>
      <a href="./replays.html">Replays</a>
      <a href="./play.html">Play</a>
      <a href="./process.html">Process</a>
    </nav>
  </header>

  <main>
    <div id="root"><div class="muted">Loading…</div></div>
  </main>

  <script type="module">
    import { sb, queryParam } from './lib/supabase.js';
    import { fmtTime, fmtDuration, fmtPct, esc, statusPill, tr } from './lib/ui.js';

    const $root = document.getElementById('root');
    const id = queryParam('id');

    if (!id) {
      $root.innerHTML = `<div class="error">no <span class="inline-code">?id=…</span> in URL</div>`;
    } else {
      load().catch(e => $root.innerHTML = `<div class="card error">${esc(e.message)}</div>`);
    }

    // -----------------------------------------------------------------
    // Hard-coded breakdown of the v9.x 1002-dim observation. Kept here
    // (not in the DB) because the encoder code is the source of truth —
    // see training/encoder.py. If a different obs_size shows up we fall
    // back to just the encoder description string.
    // -----------------------------------------------------------------
    const OBS_BREAKDOWN_V9 = [
      {
        tag: 'globals',
        name: 'Globals',
        shape: '10',
        desc: 'Game-wide signals, one per tick.',
        feats: [
          ['tick', 'fraction of game clock elapsed'],
          ['time remaining', '1 − tick / timeout'],
          ['p1 buildings', 'share of 32 slots owned by P1'],
          ['p2 buildings', 'share of 32 slots owned by P2'],
          ['neutral buildings', 'share of slots still neutral'],
          ['p1 total force', 'garrison + in-flight units'],
          ['p2 total force', 'garrison + in-flight units'],
          ['p1 share', 'p1 / (p1 + p2)'],
          ['building margin', '(p1 − p2) buildings'],
          ['unit margin', '(p1 − p2) total units'],
        ],
      },
      {
        tag: 'per-building',
        name: 'Per-building block',
        shape: '32 × 22 = 704',
        desc: 'One 22-feature row per building slot; dead slots masked to zero.',
        feats: [
          ['alive', '1 if slot holds a live building'],
          ['is_p1 / is_p2 / is_neutral', 'ownership one-hot'],
          ['garrison (raw)', 'units inside / capacity norm'],
          ['garrison ratio', 'garrison / own capacity'],
          ['capacity', 'upgrade-level proxy'],
          ['over_cap', '1 if reinforced above capacity'],
          ['x, y', 'map position (normalized)'],
          ['type one-hot (×5)', 'building class'],
          ['incoming P1 / P2', 'alive groups heading here, by side'],
          ['incoming friendly / hostile', 'relative to this slot\'s owner'],
          ['threat-capped hostile', 'min(hostile, garrison) — immediate loss'],
          ['will fall', '1 if hostile > garrison'],
          ['near-cap', '1 if garrison / capacity > 0.95'],
        ],
      },
      {
        tag: 'per-group',
        name: 'Per-group block',
        shape: '32 × 9 = 288',
        desc: 'One 9-feature row per in-flight unit group.',
        feats: [
          ['alive', '1 if this group is currently flying'],
          ['is_p1 / is_p2', 'ownership'],
          ['progress fraction', 'progress / travel — how close to arrival'],
          ['count', 'units in the group, normalized'],
          ['src x, src y', 'source building position'],
          ['tgt x, tgt y', 'target building position'],
        ],
      },
    ];

    // Head descriptions for the output panel. Matches training/net.py.
    const OUTPUT_HEADS = [
      { tag:'head',  label:'Source head',  shape:'32',
        desc:'Logits over the 32 building slots — "which of my slots sends?"' },
      { tag:'head',  label:'Type head',    shape:'5',
        desc:'Send percentage: 25% / 50% / 75% / 100% / noop. Conditional on source.' },
      { tag:'head',  label:'Target head',  shape:'32',
        desc:'Logits over the 32 slots — "where to send?" Conditional on source.' },
      { tag:'value', label:'Value head',   shape:'1',
        desc:'Scalar — expected return under the current policy.' },
    ];

    // -----------------------------------------------------------------
    // Helpers
    // -----------------------------------------------------------------
    const fmt = n => (n == null ? '—' : n.toLocaleString());

    function paramsOf(l) {
      if (l.type === 'Linear')    return l.in_features * l.out_features + l.out_features;
      if (l.type === 'Embedding') return l.num_embeddings * l.embedding_dim;
      return 0;
    }

    function shapeOf(l) {
      if (l.type === 'Linear')    return `${l.in_features} → ${l.out_features}`;
      if (l.type === 'Embedding') return `${l.num_embeddings} × ${l.embedding_dim}`;
      return '';
    }

    // Group layers by the first segment of `name` (trunk, source_head, …).
    function groupLayers(layers) {
      const groups = new Map();
      for (const l of layers) {
        const prefix = (l.name || 'root').split('.')[0] || 'root';
        if (!groups.has(prefix)) groups.set(prefix, []);
        groups.get(prefix).push(l);
      }
      return groups;
    }

    // Split what_changed into paragraphs — on blank lines, else on a single
    // " Why:" / " Motivation:" marker, else a lone paragraph.
    function paragraphs(text) {
      if (!text) return [];
      const byBlank = text.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
      if (byBlank.length > 1) return byBlank;
      const m = text.match(/^(.*?)(?:\s+)(Why:|Motivation:|Rationale:)(.*)$/is);
      if (m) return [m[1].trim(), `${m[2]} ${m[3]}`.trim()];
      return [text.trim()];
    }

    function renderNetBox(prefix, layers, badge) {
      const total = layers.reduce((s, l) => s + paramsOf(l), 0);
      const rows = layers.map(l => `
        <div class="layer-row">
          <span class="lname">${esc(l.type)}<span class="tname">${esc(l.name || '')}</span></span>
          <span class="shape">${esc(shapeOf(l))}</span>
          <span class="pcount">${paramsOf(l) ? fmt(paramsOf(l)) : '—'}</span>
        </div>
      `).join('');
      return `
        <div class="net-box ${badge?.wide ? 'wide' : ''}">
          <header>
            <strong>${esc(prefix)}</strong>
            ${badge ? `<span class="tag ${badge.cls}">${esc(badge.label)}</span>` : ''}
          </header>
          ${rows}
          <div class="foot">
            <span>${layers.length} layer${layers.length === 1 ? '' : 's'}</span>
            <span>${fmt(total)} params</span>
          </div>
        </div>
      `;
    }

    // -----------------------------------------------------------------
    // SVG architecture diagram — draws the actor-critic as size-proportional
    // neuron grids + Linear boxes + weighted connections + chained flow
    // (source output → src_embed → type & target heads).
    // -----------------------------------------------------------------
    function archSVG(m, layerList) {
      const find = (name) => layerList.find(l => l.name === name);

      const obsDim = m.obs_size || 1002;
      const l1  = find('trunk.0')        || { in_features: obsDim, out_features: 128 };
      const l2  = find('trunk.2')        || { in_features: 128, out_features: 128 };
      const sh1 = find('source_head.0')  || { in_features: 128, out_features: 64 };
      const sh2 = find('source_head.2')  || { in_features: 64, out_features: 32 };
      const th1 = find('type_head.0')    || { in_features: 144, out_features: 64 };
      const th2 = find('type_head.2')    || { in_features: 64, out_features: 5 };
      const gh1 = find('target_head.0')  || { in_features: 144, out_features: 64 };
      const gh2 = find('target_head.2')  || { in_features: 64, out_features: 32 };
      const vh1 = find('value_head.0')   || { in_features: 128, out_features: 64 };
      const vh2 = find('value_head.2')   || { in_features: 64, out_features: 1 };
      const emb = find('src_embed')      || { num_embeddings: 32, embedding_dim: 16 };

      const C = {
        input: '#4a7ba6', hidden: '#7cc0ff', body: '#34d399',
        src: '#f9a8d4', type: '#fcd34d', target: '#fca5a5', value: '#fbbf24',
        embed: '#a78bfa',
        boxBg: '#0b0d12', boxEdge: '#8a93a6',
        text: '#e6e8ef', muted: '#8a93a6',
        linkBody: 'rgba(52, 211, 153, 0.6)',
      };

      // Layout (viewBox 1200 × 820)
      const TRUNK_Y = 95;
      const HEAD_YS = { src: 260, type: 470, tgt: 610, val: 755 };
      const X = {
        input: 70, lin1: 185, hidden: 285, lin2: 385, body: 475,
        headLin1: 590, headMid: 690, headLin2: 790, headOut: 890,
      };
      const EMB_X = 890, EMB_Y = 385;

      // Grid dims scale with layer size so larger layers look bigger.
      const gridDims = (size) => {
        if (size >= 500) return { cols: 8, rows: 16, r: 3, sp: 6 };
        if (size >= 100) return { cols: 3, rows: 8,  r: 5, sp: 12 };
        if (size >= 50)  return { cols: 2, rows: 6,  r: 5, sp: 13 };
        if (size >= 20)  return { cols: 1, rows: 8,  r: 6, sp: 14 };
        if (size >= 10)  return { cols: 1, rows: 5,  r: 7, sp: 17 };
        if (size >= 2)   return { cols: 1, rows: size, r: 8, sp: 19 };
        return              { cols: 1, rows: 1,   r: 10, sp: 0 };
      };

      // Helpers
      const txt = (x, y, content, opts = {}) => {
        const { size = 11, anchor = 'middle', color = C.text, weight = 400, mono = false } = opts;
        return `<text x="${x}" y="${y}" text-anchor="${anchor}" fill="${color}" font-size="${size}" font-weight="${weight}"${mono ? ' font-family="ui-monospace,Menlo,monospace"' : ''}>${content}</text>`;
      };

      const linearBox = (cx, cy, sizeIn, sizeOut, w = 80, h = 58) => `
        <g transform="translate(${cx},${cy})">
          <rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="6" fill="${C.boxBg}" stroke="${C.boxEdge}" stroke-width="1.3"/>
          ${txt(0, -h/2 + 15, 'Linear', { weight: 600, size: 11 })}
          ${txt(0, -h/2 + 31, `${sizeIn} → ${sizeOut}`, { color: '#60a5fa', size: 10, mono: true })}
          ${txt(0, -h/2 + 46, `${(sizeIn * sizeOut + sizeOut).toLocaleString()} p`, { color: C.muted, size: 9, mono: true })}
        </g>
      `;

      const neuronGrid = (cx, cy, size, fill) => {
        const g = gridDims(size);
        const totalW = (g.cols - 1) * g.sp, totalH = (g.rows - 1) * g.sp;
        const startX = cx - totalW / 2, startY = cy - totalH / 2;
        let html = '';
        for (let i = 0; i < g.cols; i++) {
          for (let j = 0; j < g.rows; j++) {
            html += `<circle cx="${startX + i * g.sp}" cy="${startY + j * g.sp}" r="${g.r}" fill="${fill}" stroke="#1a1d27" stroke-width="1"/>`;
          }
        }
        return html;
      };

      // Mesh lines between the rightmost column of grid A and leftmost of grid B.
      const gridMesh = (cx1, cy1, size1, cx2, cy2, size2, opacity = 0.1) => {
        const g1 = gridDims(size1), g2 = gridDims(size2);
        const totalW1 = (g1.cols - 1) * g1.sp, totalH1 = (g1.rows - 1) * g1.sp;
        const totalW2 = (g2.cols - 1) * g2.sp, totalH2 = (g2.rows - 1) * g2.sp;
        const rightX1 = cx1 + totalW1 / 2, leftX2 = cx2 - totalW2 / 2;
        const startY1 = cy1 - totalH1 / 2, startY2 = cy2 - totalH2 / 2;
        let html = '';
        for (let i = 0; i < g1.rows; i++) {
          for (let j = 0; j < g2.rows; j++) {
            html += `<line x1="${rightX1 + g1.r}" y1="${startY1 + i * g1.sp}" x2="${leftX2 - g2.r}" y2="${startY2 + j * g2.sp}" stroke="rgba(96,165,250,${opacity})" stroke-width="0.6"/>`;
          }
        }
        return html;
      };

      // Right-edge / left-edge x of a grid (for wiring arrows into boxes).
      const gridRight = (cx, size) => {
        const g = gridDims(size);
        return cx + (g.cols - 1) * g.sp / 2 + g.r;
      };
      const gridBottom = (cy, size) => {
        const g = gridDims(size);
        return cy + (g.rows - 1) * g.sp / 2 + g.r;
      };

      let svg = '';

      // --- Trunk mesh (behind boxes/neurons) ---
      svg += gridMesh(X.input, TRUNK_Y, obsDim, X.hidden, TRUNK_Y, l1.out_features, 0.08);
      svg += gridMesh(X.hidden, TRUNK_Y, l1.out_features, X.body, TRUNK_Y, l2.out_features, 0.14);

      // --- Trunk Linear boxes (no ReLUs — implicit) ---
      svg += linearBox(X.lin1, TRUNK_Y, l1.in_features, l1.out_features);
      svg += linearBox(X.lin2, TRUNK_Y, l2.in_features, l2.out_features);

      // --- Trunk neurons ---
      svg += neuronGrid(X.input, TRUNK_Y, obsDim, C.input);
      svg += neuronGrid(X.hidden, TRUNK_Y, l1.out_features, C.hidden);
      svg += neuronGrid(X.body, TRUNK_Y, l2.out_features, C.body);

      // --- Trunk column labels ---
      svg += txt(X.input, TRUNK_Y + 90, `Obs`, { color: C.input, weight: 700, size: 12 });
      svg += txt(X.input, TRUNK_Y + 106, `${obsDim.toLocaleString()} floats`, { color: C.muted, size: 10, mono: true });
      svg += txt(X.hidden, TRUNK_Y + 90, `Hidden`, { color: C.hidden, weight: 700, size: 12 });
      svg += txt(X.hidden, TRUNK_Y + 106, `${l1.out_features}`, { color: C.muted, size: 10, mono: true });
      svg += txt(X.body, TRUNK_Y + 90, `Body`, { color: C.body, weight: 700, size: 12 });
      svg += txt(X.body, TRUNK_Y + 106, `shared · ${l2.out_features}`, { color: C.muted, size: 10, mono: true });

      // --- Heads ---
      const heads = [
        { key:'src',  cy: HEAD_YS.src,  color: C.src,    h1: sh1, h2: sh2, label: 'Source head',  desc: 'which slot sends?' },
        { key:'type', cy: HEAD_YS.type, color: C.type,   h1: th1, h2: th2, label: 'Type head',    desc: '25 / 50 / 75 / 100 / noop' },
        { key:'tgt',  cy: HEAD_YS.tgt,  color: C.target, h1: gh1, h2: gh2, label: 'Target head',  desc: 'where to send?' },
        { key:'val',  cy: HEAD_YS.val,  color: C.value,  h1: vh1, h2: vh2, label: 'Value head',   desc: 'expected return' },
      ];

      // Body → each head's first Linear (green link lines, drawn behind)
      const bodyRight = gridRight(X.body, l2.out_features);
      for (const h of heads) {
        svg += `<path d="M ${bodyRight + 2} ${TRUNK_Y} C ${bodyRight + 40} ${TRUNK_Y}, ${X.headLin1 - 70} ${h.cy}, ${X.headLin1 - 42} ${h.cy}" stroke="${C.linkBody}" stroke-width="1.8" fill="none"/>`;
      }

      // --- Each head: mesh + boxes + neurons + row label ---
      for (const h of heads) {
        svg += gridMesh(X.headMid, h.cy, h.h1.out_features, X.headOut, h.cy, h.h2.out_features, 0.18);
        svg += linearBox(X.headLin1, h.cy, h.h1.in_features, h.h1.out_features, 78, 56);
        svg += linearBox(X.headLin2, h.cy, h.h2.in_features, h.h2.out_features, 78, 56);
        svg += neuronGrid(X.headMid, h.cy, h.h1.out_features, C.hidden);
        svg += neuronGrid(X.headOut, h.cy, h.h2.out_features, h.color);
        svg += txt(X.headOut + 50, h.cy - 6, h.label, { anchor: 'start', color: h.color, weight: 700, size: 13 });
        svg += txt(X.headOut + 50, h.cy + 10, `${h.h2.out_features} logits · ${h.desc}`, { anchor: 'start', color: C.muted, size: 10 });
      }

      // --- Chained flow: source output → src_embed → (type, target) head inputs ---
      // Source output is the source of the sampled index that drives the embedding.
      const srcBottom = gridBottom(HEAD_YS.src, sh2.out_features);
      svg += `
        <!-- Source output → src_embed -->
        <path d="M ${X.headOut} ${srcBottom + 2} C ${X.headOut} ${srcBottom + 30}, ${EMB_X} ${EMB_Y - 50}, ${EMB_X} ${EMB_Y - 32}" stroke="${C.src}" stroke-width="2" fill="none" marker-end="url(#arrow-src)"/>
        ${txt(X.headOut + 12, (srcBottom + EMB_Y) / 2, 'sampled source idx', { color: C.src, size: 10, anchor: 'start' })}

        <!-- src_embed box -->
        <g transform="translate(${EMB_X},${EMB_Y})">
          <rect x="-78" y="-32" width="156" height="64" rx="8" fill="${C.boxBg}" stroke="${C.embed}" stroke-width="1.6"/>
          ${txt(0, -12, 'src_embed', { color: C.embed, weight: 700, size: 13 })}
          ${txt(0, 5, `${emb.num_embeddings} × ${emb.embedding_dim}`, { color: '#60a5fa', size: 10, mono: true })}
          ${txt(0, 21, 'lookup → 16-dim vector', { color: C.muted, size: 10 })}
        </g>

        <!-- src_embed → type head first Linear (concat with body features) -->
        <path d="M ${EMB_X - 78} ${EMB_Y - 8} C ${EMB_X - 220} ${EMB_Y - 8}, ${X.headLin1 + 40} ${HEAD_YS.type}, ${X.headLin1 - 12} ${HEAD_YS.type - 4}" stroke="${C.embed}" stroke-width="1.6" fill="none" marker-end="url(#arrow-embed)"/>
        <!-- src_embed → target head first Linear -->
        <path d="M ${EMB_X - 78} ${EMB_Y + 8} C ${EMB_X - 220} ${EMB_Y + 80}, ${X.headLin1 + 40} ${HEAD_YS.tgt}, ${X.headLin1 - 12} ${HEAD_YS.tgt - 4}" stroke="${C.embed}" stroke-width="1.6" fill="none" marker-end="url(#arrow-embed)"/>
      `;

      return `
        <svg class="arch-svg" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrow-embed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="${C.embed}"/>
            </marker>
            <marker id="arrow-src" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="${C.src}"/>
            </marker>
          </defs>
          ${svg}
        </svg>
      `;
    }

    // Per-block summary cards shown below the SVG (precise numbers).
    function archSummary(layerList) {
      const groups = groupLayers(layerList);
      const order = ['trunk', 'source_head', 'type_head', 'target_head', 'value_head', 'src_embed'];
      const seen = new Set();
      const keys = [...order.filter(k => groups.has(k)), ...[...groups.keys()].filter(k => !order.includes(k))];
      const entries = keys.map(k => {
        seen.add(k);
        const ls = groups.get(k);
        const total = ls.reduce((s, l) => s + (l.type === 'Linear' ? l.in_features * l.out_features + l.out_features : l.type === 'Embedding' ? l.num_embeddings * l.embedding_dim : 0), 0);
        const linears = ls.filter(l => l.type === 'Linear');
        const embeds  = ls.filter(l => l.type === 'Embedding');
        let shape;
        if (linears.length) {
          shape = `${linears[0].in_features} → ${linears.map(l => l.out_features).join(' → ')}`;
        } else if (embeds.length) {
          shape = `${embeds[0].num_embeddings} × ${embeds[0].embedding_dim}`;
        } else {
          shape = '';
        }
        return `
          <div class="block">
            <div class="title">${esc(k)}</div>
            <div class="shape">${esc(shape)}</div>
            <div class="params">${total.toLocaleString()} params</div>
          </div>
        `;
      });
      return entries.join('');
    }

    // -----------------------------------------------------------------
    // Main
    // -----------------------------------------------------------------
    async function load() {
      const [modelRes, runsRes] = await Promise.all([
        sb.from('models').select('*').eq('id', id).single(),
        sb.from('runs')
          .select('id, label, status, machine, seed, wall_ms, games_played, queued_at, result, simulator_id')
          .eq('model_id', id)
          .order('queued_at', { ascending: false })
          .limit(100),
      ]);
      if (modelRes.error) throw modelRes.error;
      if (runsRes.error)  throw runsRes.error;

      const m = modelRes.data;
      const runs = runsRes.data;

      const totalGames = runs.reduce((s, r) => s + (r.games_played || 0), 0);
      const bestLink = m.best_run_id
        ? `<a href="./run.html?id=${esc(m.best_run_id)}">${fmtPct(m.best_rate)}</a>`
        : '<span class="muted">—</span>';
      const parentLink = m.parent_model
        ? `<a href="./model.html?id=${esc(m.parent_model)}" class="mono">${esc(m.parent_model)}</a>`
        : '<span class="muted">—</span>';

      // Paragraphs for the what-changed prose block.
      const paras = paragraphs(m.what_changed);
      const proseHtml = paras.length
        ? paras.map(p => `<p>${esc(p)}</p>`).join('')
        : `<p class="muted">No notes recorded for this model.</p>`;

      // Input breakdown — v9.x has obs_size = 1002.
      let inputsHtml;
      if (m.obs_size === 1002) {
        inputsHtml = OBS_BREAKDOWN_V9.map(g => `
          <div class="feature-block">
            <header>
              <span class="tag tag-input">${esc(g.tag)}</span>
              <strong>${esc(g.name)}</strong>
              <span class="mono muted">${esc(g.shape)}</span>
            </header>
            <div class="desc">${esc(g.desc)}</div>
            <div class="feature-list">
              ${g.feats.map(([k, v]) => `
                <div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>
              `).join('')}
            </div>
          </div>
        `).join('');
      } else {
        inputsHtml = `
          <div class="muted small">
            Breakdown is only hard-coded for the v9.x 1002-dim encoder.
            This model reports <span class="mono">${esc(String(m.obs_size))}</span> observation dims.
          </div>
          <div style="margin-top:8px;" class="mono small">${esc(m.obs_encoder ?? '—')}</div>
        `;
      }

      // Build the network diagram from the layers JSON.
      const layerList = (m.layers && Array.isArray(m.layers.layers)) ? m.layers.layers : [];
      const groups = groupLayers(layerList);

      // Partition: trunk first, then heads, then src_embed.
      const TRUNK_KEYS  = ['trunk', 'body'];
      const VALUE_KEYS  = ['value_head'];
      const EMBED_KEYS  = ['src_embed'];
      const trunkEntries = [];
      const headEntries  = [];
      const valueEntries = [];
      const embedEntries = [];
      for (const [prefix, layers] of groups.entries()) {
        if (TRUNK_KEYS.includes(prefix))      trunkEntries.push([prefix, layers]);
        else if (EMBED_KEYS.includes(prefix)) embedEntries.push([prefix, layers]);
        else if (VALUE_KEYS.includes(prefix)) valueEntries.push([prefix, layers]);
        else                                  headEntries.push([prefix, layers]);
      }

      const trunkHtml = trunkEntries.length
        ? trunkEntries.map(([p, ls]) => renderNetBox(p, ls, { cls:'tag-body', label:'body', wide:true })).join('')
        : `<div class="muted small">(no trunk block found in layer spec)</div>`;

      const headsHtml = headEntries.map(([p, ls]) =>
        renderNetBox(p, ls, { cls:'tag-head', label:'policy head' })
      ).join('');

      const valueHtml = valueEntries.map(([p, ls]) =>
        renderNetBox(p, ls, { cls:'tag-value', label:'value head' })
      ).join('');

      const embedHtml = embedEntries.map(([p, ls]) =>
        renderNetBox(p, ls, { cls:'tag-embed', label:'embedding' })
      ).join('');

      const outputsHtml = OUTPUT_HEADS.map(h => `
        <div class="output-card">
          <div><span class="tag tag-${h.tag}">${esc(h.label)}</span></div>
          <div class="shape">${esc(h.shape)} logits</div>
          <div class="desc">${esc(h.desc)}</div>
        </div>
      `).join('');

      // -----------------------------------------------------------------
      // Render
      // -----------------------------------------------------------------
      $root.innerHTML = `
        <h2>Model <span class="mono">${esc(m.id)}</span></h2>

        <div class="hero-grid">
          <div class="stat-block">
            <span class="stat-label">name</span>
            <div>${esc(m.name ?? '')}</div>
          </div>
          <div class="stat-block">
            <span class="stat-label">obs → actions</span>
            <div class="stat mono">${m.obs_size} → ${m.num_actions}</div>
          </div>
          <div class="stat-block">
            <span class="stat-label">total params</span>
            <div class="stat">${fmt(m.total_params ?? 0)}</div>
          </div>
          <div class="stat-block">
            <span class="stat-label">runs</span>
            <div class="stat">${esc(String(m.run_count))}</div>
          </div>
          <div class="stat-block">
            <span class="stat-label">games played</span>
            <div class="stat">${fmt(totalGames)}</div>
          </div>
          <div class="stat-block">
            <span class="stat-label">best rate</span>
            <div class="stat">${bestLink}</div>
          </div>
          <div class="stat-block">
            <span class="stat-label">parent</span>
            <div>${parentLink}</div>
          </div>
          <div class="stat-block">
            <span class="stat-label">created</span>
            <div>${fmtTime(m.created_at)}</div>
          </div>
        </div>

        <h2>What changed &amp; why</h2>
        <div class="card prose">${proseHtml}</div>

        <h2>Inputs — what the model sees</h2>
        <div class="card">
          <div style="margin-bottom: 10px; font-size: 12px; color: var(--fg-muted);">
            Every decision tick, the encoder packs game state into a
            <span class="mono">${esc(String(m.obs_size))}</span>-dim float32 vector:
          </div>
          ${inputsHtml}
        </div>

        <h2>Architecture</h2>
        <div class="card">
          <div class="arch-legend">
            <span><span class="dot" style="background:#4a7ba6"></span>Input (obs)</span>
            <span><span class="dot" style="background:#7cc0ff"></span>Hidden</span>
            <span><span class="dot" style="background:#34d399"></span>Body (shared)</span>
            <span><span class="dot" style="background:#f9a8d4"></span>Source out</span>
            <span><span class="dot" style="background:#fcd34d"></span>Type out</span>
            <span><span class="dot" style="background:#fca5a5"></span>Target out</span>
            <span><span class="dot" style="background:#fbbf24"></span>Value out</span>
            <span><span class="dot" style="background:#a78bfa"></span>src_embed</span>
            <span><span class="act-box"></span>Linear (ReLU implicit between boxes)</span>
          </div>
          ${archSVG(m, layerList)}
          <div class="arch-summary">${archSummary(layerList)}</div>
          <div class="muted small" style="margin-top: 12px;">
            Shapes and params come from the live <span class="mono">ActorCritic</span> definition (see
            <span class="mono">training/net.py</span>). Neuron counts drawn are schematic — real widths
            are in the labels under each column and in the per-block cards above.
          </div>
        </div>

        <h2>Outputs — what the model decides</h2>
        <div class="card">
          <div style="margin-bottom: 10px; font-size: 12px; color: var(--fg-muted);">
            The agent samples chained:
            <span class="mono">source → (type | source) → (target | source)</span>.
            If the sampled type is <span class="mono">noop</span>, the flat env action is
            <span class="mono">NOOP</span> regardless of source/target.
          </div>
          <div class="output-grid">${outputsHtml}</div>
        </div>

        <h2>Runs (${runs.length})</h2>
        <div class="card">${runs.length === 0 ? '<div class="muted">no runs yet</div>' : `
          <table>
            <thead><tr>
              <th>status</th><th>label</th><th>sim</th><th>seed</th><th>machine</th>
              <th>wall</th><th>games</th><th>rate</th><th>queued</th>
            </tr></thead>
            <tbody>${runs.map(r => tr([
              statusPill(r.status),
              `<a href="./run.html?id=${esc(r.id)}">${esc(r.label)}</a>`,
              `<span class="mono">${esc(r.simulator_id)}</span>`,
              `<span class="mono">${esc(r.seed || '')}</span>`,
              `<span class="mono">${esc(r.machine)}</span>`,
              fmtDuration(r.wall_ms),
              esc(String(r.games_played ?? '—')),
              fmtPct(r.result?.rate),
              `<span class="muted">${fmtTime(r.queued_at)}</span>`,
            ])).join('')}</tbody>
          </table>`}
        </div>

        <details class="raw-spec card">
          <summary>Raw layer spec (JSON)</summary>
          <pre>${esc(JSON.stringify(m.layers, null, 2))}</pre>
        </details>
      `;
    }
  </script>
</body>
</html>
