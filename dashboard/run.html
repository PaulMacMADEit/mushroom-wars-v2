<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Run — Mushroom Wars v2</title>
  <link rel="stylesheet" href="lib/style.css">
</head>
<body>
  <header>
    <h1>Mushroom Wars v2</h1>
    <nav>
      <a href="./index.html">Overview</a>
      <a href="./runs.html">Runs</a>
      <a href="./models.html">Models</a>
      <a href="./elo.html">Leaderboard</a>
      <a href="./training.html">Training</a>
      <a href="./replays.html">Replays</a>
      <a href="./play.html">Play</a>
      <a href="./process.html">Process</a>
    </nav>
  </header>

  <main>
    <div id="root"><div class="muted">Loading…</div></div>
  </main>

  <script type="module">
    import { sb, signedUrl, queryParam } from './lib/supabase.js';
    import { fmtTime, fmtDuration, fmtPct, esc, statusPill,
             fmtElo, ticksPerMin, totalTicks, fmtBig } from './lib/ui.js';
    import { lineChart, bandChart } from './lib/chart.js';

    const $root = document.getElementById('root');
    const runId = queryParam('id');

    // Chart instances are retained so we can destroy + re-render on poll.
    const charts = new Map();

    // Hoisted to module-level so refreshCharts() and pollForUpdates() — both
    // top-level functions — can call it without a closure over load().
    function replaceCanvasWith(id, text, isError = false) {
      const c = document.getElementById(id);
      if (!c) return;
      const msg = document.createElement('div');
      msg.className = isError ? 'error' : 'muted';
      msg.style.padding = '20px';
      msg.textContent = text;
      c.replaceWith(msg);
    }

    if (!runId) {
      $root.innerHTML = `<div class="error">no <span class="inline-code">?id=…</span> in URL</div>`;
    } else {
      load().catch(e => $root.innerHTML = `<div class="card error">${esc(e.message)}</div>`);
    }

    async function load() {
      $root.innerHTML = '<div class="muted">Fetching run…</div>';
      let run, error;
      try {
        const res = await Promise.race([
          sb.from('runs').select('*').eq('id', runId).single(),
          new Promise((_, rej) => setTimeout(() => rej(new Error('Supabase timeout 8s')), 8000)),
        ]);
        run = res.data;
        error = res.error;
      } catch (e) {
        throw new Error(`fetch run failed: ${e.message}`);
      }
      if (error) throw new Error(`Supabase: ${error.message}`);
      if (!run) throw new Error(`run ${runId} not found`);

      // Artifacts: models/logs buckets are public; signedUrl now returns a
      // plain public URL synchronously.
      const weightsUrl   = signedUrl(run.weights_url);
      const optimizerUrl = signedUrl(run.optimizer_url);
      const logUrl       = signedUrl(run.log_url);

      // Derived throughput: games/min + games/update.
      const gamesPerMin = (run.games_played && run.wall_ms)
        ? (run.games_played / (run.wall_ms / 60000))
        : null;
      const updates = run.result?.updates ?? 0;
      const gamesPerUpd = (run.games_played && updates)
        ? (run.games_played / updates)
        : null;
      const stepsPerSec = run.result?.steps_per_sec ?? null;
      const totalTicksRun = totalTicks(run.result, run.hyperparams);

      $root.innerHTML = `
        <h2>Run ${esc(run.label)}</h2>
        <div class="card">
          <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:center;">
            <div>${statusPill(run.status)}</div>
            <div><span class="stat-label">id</span><div class="mono small">${esc(run.id)}</div></div>
            <div><span class="stat-label">model</span><div class="mono">${esc(run.model_id)}</div></div>
            <div><span class="stat-label">sim</span><div class="mono">${esc(run.simulator_id)}</div></div>
            <div><span class="stat-label">seed</span><div class="mono">${esc(run.seed ?? '')}</div></div>
            <div><span class="stat-label">machine</span><div class="mono">${esc(run.machine)}</div></div>
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <div class="stat">${fmtPct(run.result?.rate)}</div>
            <div class="stat-label">rate</div>
          </div>
          <div class="card">
            <div class="stat">${fmtElo(run.elo_score, run.elo_n_matches)}</div>
            <div class="stat-label">Elo (matches)</div>
          </div>
          <div class="card">
            <div class="stat">${esc(String(run.games_played ?? '—'))}</div>
            <div class="stat-label">games</div>
          </div>
          <div class="card">
            <div class="stat">${gamesPerMin != null ? gamesPerMin.toFixed(0) : '—'}</div>
            <div class="stat-label">games / min</div>
          </div>
          <div class="card">
            <div class="stat">${gamesPerUpd != null ? gamesPerUpd.toFixed(1) : '—'}</div>
            <div class="stat-label">games / update</div>
          </div>
          <div class="card">
            <div class="stat">${esc(String(updates || '—'))}</div>
            <div class="stat-label">updates</div>
          </div>
          <div class="card">
            <div class="stat">${ticksPerMin(stepsPerSec)}</div>
            <div class="stat-label">ticks / min</div>
          </div>
          <div class="card">
            <div class="stat">${fmtBig(totalTicksRun)}</div>
            <div class="stat-label">total ticks</div>
          </div>
          <div class="card">
            <div class="stat">${fmtDuration(run.wall_ms)}</div>
            <div class="stat-label">wall</div>
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <div class="stat-label">queued</div><div>${fmtTime(run.queued_at)}</div>
            <div class="stat-label" style="margin-top:10px;">started</div><div>${fmtTime(run.started_at)}</div>
            <div class="stat-label" style="margin-top:10px;">finished</div><div>${fmtTime(run.finished_at)}</div>
          </div>
          <div class="card">
            <div class="stat-label">budget</div><div>${fmtDuration(run.budget_ms)}</div>
            <div class="stat-label" style="margin-top:10px;">device</div><div class="mono">${esc(run.result?.device ?? '—')}</div>
          </div>
          <div class="card">
            <div class="stat-label">artifacts</div>
            <ul style="margin:8px 0 0; padding-left:18px;">
              <li>${weightsUrl   ? `<a href="${esc(weightsUrl)}">weights.pt</a>`   : '<span class="muted">no weights</span>'}</li>
              <li>${optimizerUrl ? `<a href="${esc(optimizerUrl)}">optimizer.pt</a>` : '<span class="muted">no optimizer</span>'}</li>
              <li>${logUrl       ? `<a href="${esc(logUrl)}">metrics.json</a>` : '<span class="muted">no log</span>'}</li>
            </ul>
          </div>
        </div>

        <h2>Training curves</h2>
        <div class="card">
          <div class="stat-label">win rate vs leaderboard (sparse — every N updates) + vs training opponent (every update)</div>
          <div style="position:relative; height:220px;"><canvas id="chart-win"></canvas></div>
          <div style="height:12px;"></div>
          <div class="stat-label">losses</div>
          <div style="position:relative; height:220px;"><canvas id="chart-loss"></canvas></div>
          <div style="height:12px;"></div>
          <div class="stat-label">policy signal (KL + policy loss)</div>
          <div style="position:relative; height:220px;"><canvas id="chart-signal"></canvas></div>
        </div>

        <h2>Stability + critic</h2>
        <div class="card">
          <div class="stat-label">PPO stability (clip fraction high = step too large; grad norm spikes = instability)</div>
          <div style="position:relative; height:220px;"><canvas id="chart-stability"></canvas></div>
          <div style="height:12px;"></div>
          <div class="stat-label">explained variance (1 = perfect critic; 0 = no better than mean; &lt;0 = worse than mean)</div>
          <div style="position:relative; height:200px;"><canvas id="chart-ev"></canvas></div>
        </div>

        <h2>Episode return distribution</h2>
        <div class="card">
          <div class="stat-label">mean (purple) with p10–p90 band (light) and min/max envelope (dashed). Mean alone hides variance collapse.</div>
          <div style="position:relative; height:240px;"><canvas id="chart-bands"></canvas></div>
        </div>

        <h2>Throughput</h2>
        <div class="card">
          <div class="stat-label">episodes completed per update</div>
          <div style="position:relative; height:220px;"><canvas id="chart-eps"></canvas></div>
          <div style="height:12px;"></div>
          <div class="stat-label" id="pool-label" style="display:none;">opponent pool size (self-play)</div>
          <div style="position:relative; height:180px;"><canvas id="chart-pool"></canvas></div>
        </div>

        <h2 id="permap-h2" style="display:none;">Win rate by level</h2>
        <div class="card" id="permap-card" style="display:none;">
          <div class="stat-label">per-level win rate over training. Catches regressions hidden by the global average.</div>
          <div id="permap-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; margin-top:8px;"></div>
        </div>

        <h2>Eval matches (during training)</h2>
        <div class="card" id="eval-matches">
          <div class="muted">no eval matches yet — populated as the run executes archive_eval_every steps.</div>
        </div>

        <h2>Training opponent over time</h2>
        <div class="card" id="training-opp">
          <div class="muted">no opponent labels recorded yet.</div>
        </div>

        <h2>Level distribution</h2>
        <div class="card" id="level-mix">
          <div class="muted">no level data recorded yet.</div>
        </div>

        <h2>Matchups (post-run evaluation)</h2>
        <div class="card" id="matchups"><div class="muted">Loading matchups…</div></div>

        <h2>Hyperparams</h2>
        <pre>${esc(JSON.stringify(run.hyperparams ?? {}, null, 2))}</pre>

        <h2>Result summary</h2>
        <pre>${esc(JSON.stringify(run.result ?? {}, null, 2))}</pre>

        ${run.error ? `<h2>Error</h2><pre class="error">${esc(run.error)}</pre>` : ''}
      `;

      // Fill in the matchups panel in parallel with the charts — uses the
      // same `games` table the Elo page does, but filtered to this run.
      loadMatchups(run.id).catch(e => {
        const el = document.getElementById('matchups');
        if (el) el.innerHTML = `<div class="error">${esc(e.message)}</div>`;
      });

      // Fetch metrics.json + render charts. Any failure is surfaced
      // visibly — a silently-blank canvas is the worst UX.
      const chartIds = ['chart-win', 'chart-loss', 'chart-signal',
                        'chart-stability', 'chart-ev', 'chart-bands',
                        'chart-eps', 'chart-pool'];

      function failAllCharts(text) {
        for (const id of chartIds) replaceCanvasWith(id, text, true);
      }

      await refreshCharts(logUrl, chartIds, failAllCharts);

      // While the run is still in flight, poll for new metrics + status every
      // 8s. The worker uploads metrics.json every few updates to the same
      // storage path, so the live file just gets longer and longer.
      if (run.status === 'running' || run.status === 'queued') {
        pollForUpdates(runId);
      }
    }

    async function refreshCharts(logUrl, chartIds, failAllCharts) {
      if (!logUrl) {
        failAllCharts('no metrics yet — waiting for first upload…');
        return;
      }
      let points = null;
      try {
        // Cache-bust so the CDN/browser doesn't hand us a stale copy.
        const resp = await fetch(`${logUrl}?t=${Date.now()}`, { cache: 'no-cache' });
        if (!resp.ok) throw new Error(`http ${resp.status}`);
        const body = await resp.json();
        points = Array.isArray(body) ? body : (body.metrics ?? []);
        if (!points.length) throw new Error('metrics array is empty');
      } catch (e) {
        failAllCharts(`fetch metrics failed: ${e.message}`);
        return;
      }

      const renderOne = (id, keys, opts) => {
        try {
          const canvas = document.getElementById(id);
          if (!canvas) { console.warn('missing canvas', id); return; }
          // Destroy previous chart on this canvas so data updates cleanly.
          const prev = charts.get(id);
          if (prev) prev.destroy();
          charts.set(id, lineChart(canvas, points, keys, opts));
        } catch (e) {
          console.error(`[${id}] chart render failed:`, e);
          replaceCanvasWith(id, `${id}: ${e.message}`, true);
        }
      };

      renderOne('chart-win',    ['win_rate_vs_leaderboard', 'win_rate'],
                { yLabel: 'win rate', yMin: 0, yMax: 1 });
      renderOne('chart-loss',   ['value_loss', 'entropy_loss'],
                { yLabel: 'loss' });
      renderOne('chart-signal', ['policy_loss', 'approx_kl'],
                { yLabel: 'signal' });

      // Stability + critic — gated on key presence so old runs render fine.
      const hasStab = points.some(p => p.clip_fraction != null || p.grad_norm != null);
      if (hasStab) {
        renderOne('chart-stability', ['clip_fraction', 'grad_norm'],
                  { yLabel: 'value' });
      } else {
        replaceCanvasWith('chart-stability', 'no clip/grad data — older run', false);
      }
      const hasEv = points.some(p => p.explained_variance != null);
      if (hasEv) {
        renderOne('chart-ev', ['explained_variance'],
                  { yLabel: 'explained variance', yMin: -1, yMax: 1 });
      } else {
        replaceCanvasWith('chart-ev', 'no explained-variance data — older run', false);
      }

      // Episode return bands — uses a separate helper because Chart.js
      // band fills need adjacent-dataset references.
      const hasBands = points.some(p =>
        p.episode_return_p10 != null || p.episode_return_p90 != null ||
        p.episode_return_min != null || p.episode_return_max != null);
      if (hasBands) {
        try {
          const canvas = document.getElementById('chart-bands');
          if (canvas) {
            const prev = charts.get('chart-bands');
            if (prev) prev.destroy();
            charts.set('chart-bands', bandChart(canvas, points,
              { yLabel: 'episode return' }));
          }
        } catch (e) {
          console.error('[chart-bands] render failed:', e);
          replaceCanvasWith('chart-bands', `chart-bands: ${e.message}`, true);
        }
      } else {
        replaceCanvasWith('chart-bands', 'no return-distribution data — older run', false);
      }

      renderOne('chart-eps',    ['episodes_completed'],
                { yLabel: 'episodes' });

      const hasPool = points.some(p => p.pool_size != null);
      if (hasPool) {
        const label = document.getElementById('pool-label');
        if (label) label.style.display = '';
        renderOne('chart-pool', ['pool_size'], { yLabel: 'snapshots' });
      }

      // Per-level win rate sparklines (item #5). Drawn fresh on each refresh
      // since the set of levels can grow as a run progresses (rare, but
      // possible if level_mix is added mid-run via an admin tweak).
      renderPerMap(points);
    }

    /** Render one mini line chart per level seen in `win_rate_by_level`.
     * Hidden entirely when no level breakdown is available (old runs or
     * level_mix-trained runs that don't currently emit per-level). */
    function renderPerMap(points) {
      const $h2  = document.getElementById('permap-h2');
      const $card = document.getElementById('permap-card');
      const $grid = document.getElementById('permap-grid');
      if (!$h2 || !$card || !$grid) return;

      // Collect the union of levels seen across all updates.
      const levels = new Set();
      for (const p of points) {
        const m = p.win_rate_by_level;
        if (m && typeof m === 'object') {
          for (const k of Object.keys(m)) levels.add(k);
        }
      }
      if (levels.size === 0) {
        $h2.style.display = 'none';
        $card.style.display = 'none';
        return;
      }
      $h2.style.display = '';
      $card.style.display = '';

      // Re-render the grid; destroy any previous per-level charts first.
      for (const k of [...charts.keys()]) {
        if (k.startsWith('chart-permap-')) {
          charts.get(k).destroy();
          charts.delete(k);
        }
      }
      $grid.innerHTML = '';
      const sorted = [...levels].sort();
      for (const level of sorted) {
        const id = `chart-permap-${level.replace(/[^a-z0-9_]/gi, '_')}`;
        const slot = document.createElement('div');
        slot.innerHTML = `
          <div class="stat-label" style="margin-bottom:4px;"><span class="mono">${level}</span></div>
          <div style="position:relative; height:140px;"><canvas id="${id}"></canvas></div>
        `;
        $grid.appendChild(slot);
        // Project the per-level series onto the same x axis as the main
        // metrics — points without this level become null gaps.
        const projected = points.map(p => {
          const m = p.win_rate_by_level;
          return { win_rate: (m && m[level] != null) ? m[level] : null };
        });
        const canvas = document.getElementById(id);
        if (canvas) {
          try {
            charts.set(id, lineChart(canvas, projected, ['win_rate'],
              { yLabel: '', xLabel: '', yMin: 0, yMax: 1 }));
          } catch (e) {
            canvas.replaceWith(Object.assign(document.createElement('div'),
              { className: 'error', textContent: e.message }));
          }
        }
      }
    }

    async function loadMatchups(runId) {
      const $panel = document.getElementById('matchups');
      if (!$panel) return;

      // All games where this run was one of the players.
      const { data: games, error } = await sb
        .from('games')
        .select('player_1_run_id, player_2_run_id, winner, map_name')
        .or(`player_1_run_id.eq.${runId},player_2_run_id.eq.${runId}`);
      if (error) { $panel.innerHTML = `<div class="error">${esc(error.message)}</div>`; return; }
      if (!games || games.length === 0) {
        $panel.innerHTML = '<div class="muted">no evaluation games yet — auto-admission queues them when training finishes, or queue manually via <span class="inline-code">cli/queue_eval.py</span></div>';
        return;
      }

      // Fetch labels for every distinct opponent id encountered.
      const oppIds = Array.from(new Set(games.flatMap(g =>
        [g.player_1_run_id, g.player_2_run_id].filter(id => id !== runId))));
      const { data: oppRows } = await sb
        .from('runs')
        .select('id, label, model_id')
        .in('id', oppIds);
      const labelOf = Object.fromEntries((oppRows || []).map(r => [r.id, r]));

      // Aggregate per-opponent.
      const byOpp = {};  // opp_id → { wins, losses, draws }
      let tot_w = 0, tot_l = 0, tot_d = 0;
      for (const g of games) {
        const oppId = g.player_1_run_id === runId ? g.player_2_run_id : g.player_1_run_id;
        const bucket = byOpp[oppId] = byOpp[oppId] || { w: 0, l: 0, d: 0 };
        if (g.winner === runId)            { bucket.w++; tot_w++; }
        else if (g.winner === null)        { bucket.d++; tot_d++; }
        else                               { bucket.l++; tot_l++; }
      }
      const rows = Object.entries(byOpp).map(([oppId, s]) => {
        const n = s.w + s.l + s.d;
        const oppLabel = labelOf[oppId]?.label ?? `(${oppId.slice(0, 8)}…)`;
        const oppLink = oppId === '00000000-0000-0000-0000-000000000001'
          ? `<span class="mono">${esc(oppLabel)}</span>`
          : `<a href="./run.html?id=${esc(oppId)}">${esc(oppLabel)}</a>`;
        return { oppId, oppLink, n, w: s.w, l: s.l, d: s.d,
                 rate: (s.w + 0.5 * s.d) / n };
      }).sort((a, b) => b.rate - a.rate);

      const totalN = tot_w + tot_l + tot_d;
      const overallRate = totalN > 0 ? (tot_w + 0.5 * tot_d) / totalN : 0;
      $panel.innerHTML = `
        <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
          <div><span class="stat-label">eval games</span><div class="stat">${totalN}</div></div>
          <div><span class="stat-label">opponents</span><div class="stat">${rows.length}</div></div>
          <div><span class="stat-label">overall win rate</span><div class="stat">${(overallRate * 100).toFixed(1)}%</div></div>
          <div><span class="stat-label">W / D / L</span><div class="mono">${tot_w} / ${tot_d} / ${tot_l}</div></div>
        </div>
        <table>
          <thead><tr>
            <th>opponent</th><th>games</th><th>W</th><th>D</th><th>L</th>
            <th>win rate</th><th>share</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => tr([
              r.oppLink,
              `<span class="mono">${r.n}</span>`,
              `<span class="win mono">${r.w}</span>`,
              `<span class="draw mono">${r.d}</span>`,
              `<span class="lose mono">${r.l}</span>`,
              `<span class="mono">${(r.rate * 100).toFixed(0)}%</span>`,
              `<span class="muted mono">${((r.n / totalN) * 100).toFixed(0)}%</span>`,
            ])).join('')}
          </tbody>
        </table>
        <div class="muted small" style="margin-top:8px;">
          Sorted by win rate. "Share" = % of this run's eval games against that opponent.
        </div>
      `;
    }

    async function pollForUpdates(runId) {
      const chartIds = ['chart-win', 'chart-loss', 'chart-signal',
                        'chart-stability', 'chart-ev', 'chart-bands',
                        'chart-eps', 'chart-pool'];
      function failAllCharts(text) {
        for (const id of chartIds) replaceCanvasWith(id, text, true);
      }

      const timer = setInterval(async () => {
        const { data: run, error } = await sb.from('runs').select('status, log_url, games_played, wall_ms, result, hyperparams, elo_score, elo_n_matches').eq('id', runId).single();
        if (error) return;
        // Update header stats row.
        const gamesPerMin = (run.games_played && run.wall_ms) ? (run.games_played / (run.wall_ms / 60000)) : null;
        const statEls = document.querySelectorAll('.grid .card .stat');
        // Header grid order: rate, Elo, games, games/min, games/update, updates, ticks/min, total-ticks, wall
        if (statEls.length >= 9) {
          const u = run.result?.updates ?? 0;
          const gpu = (run.games_played && u) ? (run.games_played / u) : null;
          const sps = run.result?.steps_per_sec;
          const tt = totalTicks(run.result, run.hyperparams);
          statEls[0].textContent = (run.result?.rate != null) ? (run.result.rate * 100).toFixed(1) + '%' : '—';
          statEls[1].innerHTML    = fmtElo(run.elo_score, run.elo_n_matches);
          statEls[2].textContent = String(run.games_played ?? '—');
          statEls[3].textContent = gamesPerMin != null ? gamesPerMin.toFixed(0) : '—';
          statEls[4].textContent = gpu != null ? gpu.toFixed(1) : '—';
          statEls[5].textContent = String(u || '—');
          statEls[6].textContent = ticksPerMin(sps);
          statEls[7].textContent = fmtBig(tt);
          statEls[8].textContent = run.wall_ms ? fmtDurationShort(run.wall_ms) : '—';
        }
        // Refresh charts with the latest live log.
        await refreshCharts(signedUrl(run.log_url), chartIds, failAllCharts);
        // Stop polling once terminal.
        if (run.status === 'done' || run.status === 'failed') {
          clearInterval(timer);
        }
      }, 8000);
    }

    function fmtDurationShort(ms) {
      const s = Math.round(ms / 1000);
      if (s < 60)   return `${s}s`;
      if (s < 3600) return `${Math.floor(s / 60)}m ${s % 60}s`;
      return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
    }
  </script>
</body>
</html>
