<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Run — Mushroom Wars v2</title>
  <link rel="stylesheet" href="lib/style.css">
  <style>
    /* Feature-importance panel */
    .fi-list   { display:flex; flex-direction:column; gap:3px; }
    .fi-header,
    .fi-row    {
      display:grid;
      grid-template-columns: 78px 180px 1fr 64px 64px 56px;
      align-items:center;
      gap:10px;
      font-size:12px;
      padding:3px 4px;
    }
    .fi-row    { border-bottom:1px dashed var(--border); }
    .fi-row:last-child { border-bottom:none; }
    .fi-header { color:var(--fg-muted); font-weight:600; padding-bottom:6px;
                 border-bottom:1px solid var(--border); margin-bottom:4px; }
    .fi-tag    {
      display:inline-block; font-size:10px; padding:2px 6px;
      border-radius:4px; font-weight:600; text-transform:uppercase;
      letter-spacing:.4px; text-align:center;
    }
    .fi-name   { font-family:var(--mono); }
    .fi-bar    { background:rgba(255,255,255,0.04); border-radius:3px; height:10px; overflow:hidden; }
    .fi-bar-fill { height:100%; transition:width .2s; }
    .fi-num    { font-family:var(--mono); text-align:right; }
    .fi-help   { color:var(--fg-muted); font-size:12px; line-height:1.5; margin-bottom:12px; }
    .fi-help strong { color:var(--fg); }
    .fi-controls {
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      padding:10px; background:rgba(96,165,250,.05);
      border:1px solid var(--border); border-radius:var(--radius);
      margin-bottom:12px;
    }
    .fi-controls label  { font-size:12px; color:var(--fg-muted); }
    .fi-controls select,
    .fi-controls input[type=number] {
      background:var(--bg-card); color:var(--fg);
      border:1px solid var(--border); border-radius:4px;
      padding:5px 8px; font-size:12px; font-family:var(--mono);
    }
    .fi-controls input[type=number] { width:70px; }
    .fi-controls button {
      background:var(--accent); color:#0b0d12;
      border:0; border-radius:4px;
      padding:6px 14px; font-size:12px; font-weight:600;
      cursor:pointer;
    }
    .fi-controls button:disabled {
      background:var(--border); color:var(--fg-muted); cursor:not-allowed;
    }
    .fi-status { font-size:12px; color:var(--fg-muted); }
    .fi-status.running { color:var(--accent); }
    .fi-status.failed  { color:var(--danger); }
    .fi-status.done    { color:var(--accent-2); }
    @media (max-width: 700px) {
      .fi-header, .fi-row { grid-template-columns: 64px 130px 1fr 50px 50px; }
      .fi-row .fi-num.wl2-col { display:none; }
      .fi-header span:nth-child(6) { display:none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Mushroom Wars v2</h1>
    <nav>
      <a href="./index.html">Overview</a>
      <a href="./runs.html">Runs</a>
      <a href="./models.html">Models</a>
      <a href="./elo.html">Leaderboard</a>
      <a href="./training.html">Training</a>
      <a href="./replays.html">Replays</a>
      <a href="./play.html">Play</a>
      <a href="./process.html">Process</a>
    </nav>
  </header>

  <main>
    <div id="root"><div class="muted">Loading…</div></div>
  </main>

  <script type="module">
    import { sb, signedUrl, queryParam } from './lib/supabase.js';
    import { fmtTime, fmtDuration, fmtPct, esc, statusPill,
             fmtElo, ticksPerMin, totalTicks, fmtBig } from './lib/ui.js';
    import { lineChart, bandChart } from './lib/chart.js';

    const $root = document.getElementById('root');
    const runId = queryParam('id');

    // Chart instances are retained so we can destroy + re-render on poll.
    const charts = new Map();

    // Hoisted to module-level so refreshCharts() and pollForUpdates() — both
    // top-level functions — can call it without a closure over load().
    function replaceCanvasWith(id, text, isError = false) {
      const c = document.getElementById(id);
      if (!c) return;
      const msg = document.createElement('div');
      msg.className = isError ? 'error' : 'muted';
      msg.style.padding = '20px';
      msg.textContent = text;
      c.replaceWith(msg);
    }

    if (!runId) {
      $root.innerHTML = `<div class="error">no <span class="inline-code">?id=…</span> in URL</div>`;
    } else {
      load().catch(e => $root.innerHTML = `<div class="card error">${esc(e.message)}</div>`);
    }

    async function load() {
      $root.innerHTML = '<div class="muted">Fetching run…</div>';
      let run, error;
      try {
        const res = await Promise.race([
          sb.from('runs').select('*').eq('id', runId).single(),
          new Promise((_, rej) => setTimeout(() => rej(new Error('Supabase timeout 8s')), 8000)),
        ]);
        run = res.data;
        error = res.error;
      } catch (e) {
        throw new Error(`fetch run failed: ${e.message}`);
      }
      if (error) throw new Error(`Supabase: ${error.message}`);
      if (!run) throw new Error(`run ${runId} not found`);

      // Artifacts: models/logs buckets are public; signedUrl now returns a
      // plain public URL synchronously.
      const weightsUrl   = signedUrl(run.weights_url);
      const optimizerUrl = signedUrl(run.optimizer_url);
      const logUrl       = signedUrl(run.log_url);

      // Derived throughput: games/min + games/update.
      const gamesPerMin = (run.games_played && run.wall_ms)
        ? (run.games_played / (run.wall_ms / 60000))
        : null;
      const updates = run.result?.updates ?? 0;
      const gamesPerUpd = (run.games_played && updates)
        ? (run.games_played / updates)
        : null;
      const stepsPerSec = run.result?.steps_per_sec ?? null;
      const totalTicksRun = totalTicks(run.result, run.hyperparams);

      // "Rerank this run" hook — only for rated training runs (admin job
      // rows can't rerate themselves and unrated rows have no anchor).
      const canRerank = run.simulator_id !== 'admin'
                     && run.status === 'done'
                     && (run.elo_n_matches ?? 0) >= 1;
      $root.innerHTML = `
        <h2>Run ${esc(run.label)}</h2>
        <div class="card">
          <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:center;">
            <div>${statusPill(run.status)}</div>
            <div><span class="stat-label">id</span><div class="mono small">${esc(run.id)}</div></div>
            <div><span class="stat-label">model</span><div class="mono">${esc(run.model_id)}</div></div>
            <div><span class="stat-label">sim</span><div class="mono">${esc(run.simulator_id)}</div></div>
            <div><span class="stat-label">seed</span><div class="mono">${esc(run.seed ?? '')}</div></div>
            <div><span class="stat-label">machine</span><div class="mono">${esc(run.machine)}</div></div>
            ${canRerank ? `<div style="margin-left:auto;">
              <button id="rr1-toggle" class="btn-primary">Rerank this run</button>
            </div>` : ''}
          </div>
          ${canRerank ? `<div id="rr1-form" style="display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--border); display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;">
            <label class="small muted">opponents
              <br><select id="rr1-mode" style="background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:4px 8px;">
                <option value="near" selected>±N nearest by Elo</option>
                <option value="top">top N by Elo</option>
              </select>
            </label>
            <label class="small muted">N
              <br><input id="rr1-n" type="number" min="1" max="20" value="5" style="width:60px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:4px 8px;">
            </label>
            <label class="small muted">games/match
              <br><input id="rr1-games" type="number" min="8" max="256" step="8" value="64" style="width:80px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:4px 8px;">
            </label>
            <label class="small muted">level
              <br><select id="rr1-level" style="background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:4px 8px;">
                <option value="random_close_4_5">random_close_4_5</option>
                <option value="random_4_8">random_4_8</option>
                <option value="random_8_16" selected>random_8_16</option>
                <option value="random_16_24">random_16_24</option>
              </select>
            </label>
            <button id="rr1-submit" class="btn-primary" style="height:30px;">Queue rerank</button>
            <span id="rr1-status" class="muted small"></span>
          </div>` : ''}
        </div>

        <div class="grid">
          <div class="card">
            <div class="stat">${fmtPct(run.result?.rate)}</div>
            <div class="stat-label">rate</div>
          </div>
          <div class="card">
            <div class="stat">${fmtElo(run.elo_score, run.elo_n_matches)}</div>
            <div class="stat-label">Elo (matches)</div>
          </div>
          <div class="card">
            <div class="stat">${esc(String(run.games_played ?? '—'))}</div>
            <div class="stat-label">games</div>
          </div>
          <div class="card">
            <div class="stat">${gamesPerMin != null ? gamesPerMin.toFixed(0) : '—'}</div>
            <div class="stat-label">games / min</div>
          </div>
          <div class="card">
            <div class="stat">${gamesPerUpd != null ? gamesPerUpd.toFixed(1) : '—'}</div>
            <div class="stat-label">games / update</div>
          </div>
          <div class="card">
            <div class="stat">${esc(String(updates || '—'))}</div>
            <div class="stat-label">updates</div>
          </div>
          <div class="card">
            <div class="stat">${ticksPerMin(stepsPerSec)}</div>
            <div class="stat-label">ticks / min</div>
          </div>
          <div class="card">
            <div class="stat">${fmtBig(totalTicksRun)}</div>
            <div class="stat-label">total ticks</div>
          </div>
          <div class="card">
            <div class="stat">${fmtDurationShort(run.budget_ms)}</div>
            <div class="stat-label">budget</div>
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <div class="stat-label">queued</div><div>${fmtTime(run.queued_at)}</div>
            <div class="stat-label" style="margin-top:10px;">started</div><div>${fmtTime(run.started_at)}</div>
            <div class="stat-label" style="margin-top:10px;">finished</div><div>${fmtTime(run.finished_at)}</div>
          </div>
          <div class="card">
            <div class="stat-label">elapsed</div><div>${fmtDuration(run.wall_ms)}</div>
            <div class="stat-label" style="margin-top:10px;">device</div><div class="mono">${esc(run.result?.device ?? '—')}</div>
          </div>
          <div class="card">
            <div class="stat-label">artifacts</div>
            <ul style="margin:8px 0 0; padding-left:18px;">
              <li>${weightsUrl   ? `<a href="${esc(weightsUrl)}">weights.pt</a>`   : '<span class="muted">no weights</span>'}</li>
              <li>${optimizerUrl ? `<a href="${esc(optimizerUrl)}">optimizer.pt</a>` : '<span class="muted">no optimizer</span>'}</li>
              <li>${logUrl       ? `<a href="${esc(logUrl)}">metrics.json</a>` : '<span class="muted">no log</span>'}</li>
            </ul>
          </div>
        </div>

        <div id="rerate-full-diff"></div>

        <h2>Training curves</h2>
        <div class="card">
          <div class="stat-label">win rate vs leaderboard (sparse — every N updates) + vs training opponent (every update)</div>
          <div style="position:relative; height:220px;"><canvas id="chart-win"></canvas></div>
          <div style="height:12px;"></div>
          <div class="stat-label">losses</div>
          <div style="position:relative; height:220px;"><canvas id="chart-loss"></canvas></div>
          <div style="height:12px;"></div>
          <div class="stat-label">policy signal (KL + policy loss)</div>
          <div style="position:relative; height:220px;"><canvas id="chart-signal"></canvas></div>
        </div>

        <h2>Win rate progression</h2>
        <div class="card" id="win-rate-progression">
          <div class="muted">no data yet — populated once a few training updates have completed.</div>
        </div>

        <h2>End-of-run rematch</h2>
        <div class="card" id="rotation-rematch">
          <div class="muted">populated after training finishes (only for runs with opponent_pool_mode=rotate_per_update).</div>
        </div>

        <h2>Stability + critic</h2>
        <div class="card">
          <div class="stat-label">PPO stability (clip fraction high = step too large; grad norm spikes = instability)</div>
          <div style="position:relative; height:220px;"><canvas id="chart-stability"></canvas></div>
          <div style="height:12px;"></div>
          <div class="stat-label">explained variance (1 = perfect critic; 0 = no better than mean; &lt;0 = worse than mean)</div>
          <div style="position:relative; height:200px;"><canvas id="chart-ev"></canvas></div>
        </div>

        <h2>Episode return distribution</h2>
        <div class="card">
          <div class="stat-label">mean (purple) with p10–p90 band (light) and min/max envelope (dashed). Mean alone hides variance collapse.</div>
          <div style="position:relative; height:240px;"><canvas id="chart-bands"></canvas></div>
        </div>

        <h2>Throughput</h2>
        <div class="card">
          <div class="stat-label">episodes completed per update</div>
          <div style="position:relative; height:220px;"><canvas id="chart-eps"></canvas></div>
          <div style="height:12px;"></div>
          <div class="stat-label" id="pool-label" style="display:none;">opponent pool size (self-play)</div>
          <div style="position:relative; height:180px;"><canvas id="chart-pool"></canvas></div>
        </div>

        <h2 id="permap-h2" style="display:none;">Win rate by level</h2>
        <div class="card" id="permap-card" style="display:none;">
          <div class="stat-label">per-level win rate over training. Catches regressions hidden by the global average.</div>
          <div id="permap-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; margin-top:8px;"></div>
        </div>

        <h2>Eval matches (during training)</h2>
        <div class="card" id="eval-matches">
          <div class="muted">no eval matches yet — populated as the run executes archive_eval_every steps.</div>
        </div>

        <h2>Training opponent over time</h2>
        <div class="card" id="training-opp">
          <div class="muted">no opponent labels recorded yet.</div>
        </div>

        <h2>Level distribution</h2>
        <div class="card" id="level-mix">
          <div class="muted">no level data recorded yet.</div>
        </div>

        <h2>Feature importance</h2>
        <div class="card" id="feature-importance"><div class="muted">Loading attributions…</div></div>

        <h2>Matchups (post-run evaluation)</h2>
        <div class="card" id="matchups"><div class="muted">Loading matchups…</div></div>

        <h2>Reward scheme</h2>
        <div class="card" id="reward-panel"></div>

        <h2>Hyperparams</h2>
        <div class="card" id="hyperparams-panel"></div>

        <h2>Result summary</h2>
        <pre>${esc(JSON.stringify(run.result ?? {}, null, 2))}</pre>

        ${run.error ? `<h2>Error</h2><pre class="error">${esc(run.error)}</pre>` : ''}
      `;

      // Wire the "Rerank this run" toggle + submit if it was rendered.
      const $rr1Toggle = document.getElementById('rr1-toggle');
      const $rr1Form   = document.getElementById('rr1-form');
      const $rr1Submit = document.getElementById('rr1-submit');
      const $rr1Status = document.getElementById('rr1-status');
      $rr1Toggle?.addEventListener('click', () => {
        $rr1Form.style.display = ($rr1Form.style.display === 'none') ? 'flex' : 'none';
      });
      $rr1Submit?.addEventListener('click', async () => {
        const mode  = document.getElementById('rr1-mode').value;
        const n     = parseInt(document.getElementById('rr1-n').value, 10);
        const games = parseInt(document.getElementById('rr1-games').value, 10);
        const level = document.getElementById('rr1-level').value;
        const ts = new Date().toISOString().slice(2,16).replace(/[-T:]/g,'').replace(/(\d{6})(\d{4})/, '$1-$2');
        const label = `rerank-${ts}-${run.label.slice(0,30)}-${mode}${n}`;
        $rr1Submit.disabled = true;
        $rr1Status.textContent = 'queueing…';
        const { data, error } = await sb.from('runs').insert({
          project: 'mushroom-wars',
          model_id: 'admin',
          simulator_id: 'admin',
          label,
          status: 'queued',
          budget_ms: 0,
          machine: '',
          launch_at: Date.now(),
          hyperparams: { kind: 'rerate_one', target_run_id: run.id, mode, n, games, level },
        }).select('id').single();
        $rr1Submit.disabled = false;
        if (error) {
          $rr1Status.innerHTML = `<span class="error">${esc(error.message)}</span>`;
          return;
        }
        $rr1Status.innerHTML = `queued <a href="./run.html?id=${esc(data.id)}">${esc(label)}</a>`;
      });

      // For rerate_full admin jobs, render a before/after leaderboard diff
      // table so the impact of the rerank is legible at a glance.
      if (run.simulator_id === 'admin' && run.result?.kind === 'rerate_full') {
        renderRerateFullDiff(run.result);
      }

      // Render structured hyperparams — driven by run.hyperparams which is
      // available immediately. No need to wait for metrics.json.
      renderHyperparams(run.hyperparams ?? {});
      renderRewardScheme(run.hyperparams ?? {});

      // Fill in the matchups panel in parallel with the charts — uses the
      // same `games` table the Elo page does, but filtered to this run.
      loadMatchups(run.id).catch(e => {
        const el = document.getElementById('matchups');
        if (el) el.innerHTML = `<div class="error">${esc(e.message)}</div>`;
      });

      // Feature importance — populated offline by scripts/compute_attributions.py.
      loadFeatureImportance(run.id).catch(e => {
        const el = document.getElementById('feature-importance');
        if (el) el.innerHTML = `<div class="error">${esc(e.message)}</div>`;
      });

      // Fetch metrics.json + render charts. Any failure is surfaced
      // visibly — a silently-blank canvas is the worst UX.
      const chartIds = ['chart-win', 'chart-loss', 'chart-signal',
                        'chart-stability', 'chart-ev', 'chart-bands',
                        'chart-eps', 'chart-pool'];

      function failAllCharts(text) {
        for (const id of chartIds) replaceCanvasWith(id, text, true);
      }

      await refreshCharts(logUrl, chartIds, failAllCharts, run);

      // While the run is still in flight, poll for new metrics + status every
      // 8s. The worker uploads metrics.json every few updates to the same
      // storage path, so the live file just gets longer and longer.
      if (run.status === 'running' || run.status === 'queued') {
        pollForUpdates(runId);
      }
    }

    async function refreshCharts(logUrl, chartIds, failAllCharts, run) {
      if (!logUrl) {
        failAllCharts('no metrics yet — waiting for first upload…');
        return;
      }
      let points = null;
      try {
        // Cache-bust so the CDN/browser doesn't hand us a stale copy.
        const resp = await fetch(`${logUrl}?t=${Date.now()}`, { cache: 'no-cache' });
        if (!resp.ok) throw new Error(`http ${resp.status}`);
        const body = await resp.json();
        points = Array.isArray(body) ? body : (body.metrics ?? []);
        if (!points.length) throw new Error('metrics array is empty');
      } catch (e) {
        failAllCharts(`fetch metrics failed: ${e.message}`);
        return;
      }

      const renderOne = (id, keys, opts) => {
        try {
          const canvas = document.getElementById(id);
          if (!canvas) { console.warn('missing canvas', id); return; }
          // Destroy previous chart on this canvas so data updates cleanly.
          const prev = charts.get(id);
          if (prev) prev.destroy();
          charts.set(id, lineChart(canvas, points, keys, opts));
        } catch (e) {
          console.error(`[${id}] chart render failed:`, e);
          replaceCanvasWith(id, `${id}: ${e.message}`, true);
        }
      };

      // win_rate / draw_rate / loss_rate together — see if a stalled cell is
      // turtling (high draw_rate) vs actually losing (high loss_rate).
      // Older runs lack draw_rate/loss_rate; the chart auto-skips missing keys.
      renderOne('chart-win',    ['win_rate_vs_leaderboard', 'win_rate', 'draw_rate', 'loss_rate'],
                { yLabel: 'rate', yMin: 0, yMax: 1, yPct: true });
      renderOne('chart-loss',   ['value_loss', 'entropy_loss'],
                { yLabel: 'loss' });
      renderOne('chart-signal', ['policy_loss', 'approx_kl'],
                { yLabel: 'signal' });

      // Stability + critic — gated on key presence so old runs render fine.
      const hasStab = points.some(p => p.clip_fraction != null || p.grad_norm != null);
      if (hasStab) {
        renderOne('chart-stability', ['clip_fraction', 'grad_norm'],
                  { yLabel: 'value' });
      } else {
        replaceCanvasWith('chart-stability', 'no clip/grad data — older run', false);
      }
      const hasEv = points.some(p => p.explained_variance != null);
      if (hasEv) {
        renderOne('chart-ev', ['explained_variance'],
                  { yLabel: 'explained variance', yMin: -1, yMax: 1 });
      } else {
        replaceCanvasWith('chart-ev', 'no explained-variance data — older run', false);
      }

      // Episode return bands — uses a separate helper because Chart.js
      // band fills need adjacent-dataset references.
      const hasBands = points.some(p =>
        p.episode_return_p10 != null || p.episode_return_p90 != null ||
        p.episode_return_min != null || p.episode_return_max != null);
      if (hasBands) {
        try {
          const canvas = document.getElementById('chart-bands');
          if (canvas) {
            const prev = charts.get('chart-bands');
            if (prev) prev.destroy();
            charts.set('chart-bands', bandChart(canvas, points,
              { yLabel: 'episode return' }));
          }
        } catch (e) {
          console.error('[chart-bands] render failed:', e);
          replaceCanvasWith('chart-bands', `chart-bands: ${e.message}`, true);
        }
      } else {
        replaceCanvasWith('chart-bands', 'no return-distribution data — older run', false);
      }

      renderOne('chart-eps',    ['episodes_completed'],
                { yLabel: 'episodes' });

      const hasPool = points.some(p => p.pool_size != null);
      if (hasPool) {
        const label = document.getElementById('pool-label');
        if (label) label.style.display = '';
        renderOne('chart-pool', ['pool_size'], { yLabel: 'snapshots' });
      }

      // Per-level win rate sparklines (item #5). Drawn fresh on each refresh
      // since the set of levels can grow as a run progresses (rare, but
      // possible if level_mix is added mid-run via an admin tweak).
      renderPerMap(points);

      // Slice 2/3 panels — sourced entirely from metrics.json, so they
      // populate live as the run progresses. Each is gated on key presence
      // so old runs (pre-2026-04-29) render the empty-state cleanly.
      renderEvalMatches(points);
      renderTrainingOpp(points);
      renderWinRateProgression(points, run ?? {});
      renderLevelMix(points);
      renderRotationRematch(run ?? {});
    }

    /** rerate_full before/after diff: pulls top_before + top_after from
     * the job's result jsonb and renders a unioned table. Each row shows
     * label, Elo before/after, Δ-Elo, and rank change ↑↓→. */
    function renderRerateFullDiff(result) {
      const $root = document.getElementById('rerate-full-diff');
      if (!$root) return;
      const before = Array.isArray(result?.top_before) ? result.top_before : [];
      const after  = Array.isArray(result?.top_after)  ? result.top_after  : [];
      if (!before.length && !after.length) return;

      // Index by run id so we can union and look up the matching row.
      const idxBefore = Object.fromEntries(before.map(r => [r.id, r]));
      const idxAfter  = Object.fromEntries(after.map(r => [r.id, r]));
      const allIds = Array.from(new Set([...before.map(r => r.id), ...after.map(r => r.id)]));

      // Sort by AFTER rank (then before rank for runs that fell off).
      allIds.sort((a, b) => {
        const ra = idxAfter[a]?.rank ?? 999;
        const rb = idxAfter[b]?.rank ?? 999;
        if (ra !== rb) return ra - rb;
        return (idxBefore[a]?.rank ?? 999) - (idxBefore[b]?.rank ?? 999);
      });

      const arrow = (delta) => {
        if (delta == null) return '<span class="muted">—</span>';
        if (delta === 0)   return '<span class="muted">→ 0</span>';
        if (delta > 0)     return `<span class="win">↑ ${delta}</span>`;
        return                    `<span class="lose">↓ ${-delta}</span>`;
      };
      const eloDelta = (b, a) => {
        if (b == null || a == null) return null;
        return Math.round(a - b);
      };
      const eloDeltaStr = (d) => {
        if (d == null) return '<span class="muted">—</span>';
        if (d === 0)   return '<span class="muted">0</span>';
        const cls = d > 0 ? 'win' : 'lose';
        return `<span class="${cls}">${d > 0 ? '+' : ''}${d}</span>`;
      };

      const rows = allIds.map(id => {
        const b = idxBefore[id];
        const a = idxAfter[id];
        const label = (a?.label ?? b?.label ?? '').slice(0, 60);
        const beforeRank = b ? `#${b.rank}` : '<span class="muted">—</span>';
        const afterRank  = a ? `#${a.rank}` : '<span class="muted">dropped</span>';
        const beforeElo  = b ? Math.round(b.elo) : null;
        const afterElo   = a ? Math.round(a.elo) : null;
        const dElo       = eloDelta(beforeElo, afterElo);
        const dRank      = (b && a) ? (b.rank - a.rank) : null;  // positive = moved up
        return `<tr>
          <td><a href="./run.html?id=${esc(id)}">${esc(label)}</a></td>
          <td class="mono">${beforeRank}</td>
          <td class="mono">${afterRank}</td>
          <td class="mono">${arrow(dRank)}</td>
          <td class="mono">${beforeElo ?? '<span class="muted">—</span>'}</td>
          <td class="mono">${afterElo  ?? '<span class="muted">—</span>'}</td>
          <td class="mono">${eloDeltaStr(dElo)}</td>
        </tr>`;
      }).join('');

      const movedUp   = allIds.filter(id => idxBefore[id] && idxAfter[id] && idxBefore[id].rank > idxAfter[id].rank).length;
      const movedDown = allIds.filter(id => idxBefore[id] && idxAfter[id] && idxBefore[id].rank < idxAfter[id].rank).length;
      const dropped   = allIds.filter(id => idxBefore[id] && !idxAfter[id]).length;
      const arrived   = allIds.filter(id => !idxBefore[id] && idxAfter[id]).length;

      $root.innerHTML = `
        <h2>Before / after</h2>
        <div class="card">
          <div class="muted small" style="margin-bottom:10px;">
            Snapshot of top 30 before reset vs top 30 after rebuild. Sorted by post-rebuild rank.
            <strong>${movedUp}</strong> moved up · <strong>${movedDown}</strong> moved down ·
            <strong>${dropped}</strong> dropped out · <strong>${arrived}</strong> arrived.
          </div>
          <table>
            <thead><tr>
              <th>run</th>
              <th>before</th><th>after</th><th>Δ rank</th>
              <th>Elo before</th><th>Elo after</th><th>Δ Elo</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    /** End-of-run rematch panel: shows the final policy's win rate vs each
     * opponent it rotated through during training. result.rotation_rematch
     * is populated by workers/worker.py after the training loop finishes. */
    function renderRotationRematch(run) {
      const $card = document.getElementById('rotation-rematch');
      if (!$card) return;
      const data = run?.result?.rotation_rematch;
      if (!data || typeof data !== 'object' || !Object.keys(data).length) {
        $card.innerHTML = '<div class="muted">no rematch data — only populated for completed runs with opponent_pool_mode=rotate_per_update.</div>';
        return;
      }
      // Sort by final win rate descending so strongest matchups float to top.
      const rows = Object.entries(data).map(([opp, d]) => ({
        opp,
        rate: d?.rate,
        initial: d?.initial_rate,
        games: d?.games,
        p1_wins: d?.p1_wins,
        delta: (d?.rate != null && d?.initial_rate != null) ? d.rate - d.initial_rate : null,
        error: d?.error,
      })).sort((a, b) => (b.rate ?? -1) - (a.rate ?? -1));

      const cellColor = (wr) => {
        if (wr == null) return 'transparent';
        const t = Math.max(0, Math.min(1, wr));
        const hue = Math.round(120 * t);
        return `hsla(${hue}, 65%, 42%, 0.55)`;
      };
      const fmtDelta = (d) => {
        if (d == null) return '<span class="muted">—</span>';
        const sign = d > 0 ? '+' : '';
        const cls  = d > 0 ? 'win' : (d < 0 ? 'lose' : '');
        return `<span class="mono ${cls}">${sign}${(d*100).toFixed(0)}pp</span>`;
      };

      $card.innerHTML = `
        <div class="stat-label" style="margin-bottom:8px;">
          25-game rematch with the FINAL policy vs each opponent it faced during training. Δ = final − initial training-rollout win rate.
        </div>
        <table>
          <thead><tr>
            <th>opponent</th>
            <th>initial</th>
            <th>final</th>
            <th>Δ</th>
            <th>games</th>
            <th>wins</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => {
              if (r.error) {
                return `<tr><td><span class="mono">${esc(r.opp)}</span></td><td colspan="5"><span class="error">${esc(r.error)}</span></td></tr>`;
              }
              const initialCell = r.initial != null
                ? `<td style="text-align:center;background:${cellColor(r.initial)};"><span class="mono">${(r.initial*100).toFixed(0)}%</span></td>`
                : `<td><span class="muted">—</span></td>`;
              const finalCell = r.rate != null
                ? `<td style="text-align:center;background:${cellColor(r.rate)};"><span class="mono">${(r.rate*100).toFixed(0)}%</span></td>`
                : `<td><span class="muted">—</span></td>`;
              return `<tr>
                <td><span class="mono">${esc(r.opp)}</span></td>
                ${initialCell}
                ${finalCell}
                <td>${fmtDelta(r.delta)}</td>
                <td><span class="mono small">${r.games ?? '—'}</span></td>
                <td><span class="mono small">${r.p1_wins ?? '—'}</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    /** Eval match history — flatten metrics.json[*].eval_matches into rows
     * so you can audit "which champion did we play, when, on what, who won". */
    function renderEvalMatches(points) {
      const $card = document.getElementById('eval-matches');
      if (!$card) return;
      const matches = [];
      for (const p of points) {
        const arr = p.eval_matches;
        if (Array.isArray(arr)) for (const m of arr) matches.push(m);
      }
      if (!matches.length) {
        $card.innerHTML = '<div class="muted">no eval matches yet — populated as the run executes archive_eval_every steps.</div>';
        return;
      }
      const byOpp = {};
      for (const m of matches) {
        const k = m.opp_id_short || m.opp_label || '?';
        const b = byOpp[k] = byOpp[k] || {
          label: m.opp_label, id: m.opp_id_short, elo: m.opp_elo,
          w: 0, l: 0, d: 0, n: 0,
        };
        if (m.error) continue;
        b.w += m.p1_wins || 0;
        b.l += m.p2_wins || 0;
        b.d += m.draws   || 0;
        b.n += m.total   || 0;
      }
      const summary = Object.values(byOpp)
        .map(o => ({ ...o, rate: o.n > 0 ? (o.w + 0.5 * o.d) / o.n : null }))
        .sort((a, b) => (b.elo ?? -1e9) - (a.elo ?? -1e9));

      const recent = matches.slice(-30).reverse();

      const tot = summary.reduce((s, o) => ({
        w: s.w + o.w, l: s.l + o.l, d: s.d + o.d, n: s.n + o.n,
      }), { w: 0, l: 0, d: 0, n: 0 });
      const overallRate = tot.n > 0 ? (tot.w + 0.5 * tot.d) / tot.n : 0;

      $card.innerHTML = `
        <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
          <div><span class="stat-label">total games</span><div class="stat">${tot.n}</div></div>
          <div><span class="stat-label">opponents</span><div class="stat">${summary.length}</div></div>
          <div><span class="stat-label">overall win rate</span><div class="stat">${(overallRate*100).toFixed(1)}%</div></div>
          <div><span class="stat-label">W / D / L</span><div class="mono">${tot.w} / ${tot.d} / ${tot.l}</div></div>
        </div>

        <div class="stat-label" style="margin-bottom:6px;">per opponent (sorted by Elo)</div>
        <table>
          <thead><tr>
            <th>opponent</th><th>Elo</th><th>games</th><th>W</th><th>D</th><th>L</th><th>win rate</th>
          </tr></thead>
          <tbody>
            ${summary.map(o => `<tr>
              <td><span class="mono small">${esc(o.id ?? '')}</span> ${esc(o.label ?? '')}</td>
              <td><span class="mono">${o.elo != null ? o.elo.toFixed(0) : '—'}</span></td>
              <td><span class="mono">${o.n}</span></td>
              <td><span class="win mono">${o.w}</span></td>
              <td><span class="draw mono">${o.d}</span></td>
              <td><span class="lose mono">${o.l}</span></td>
              <td><span class="mono">${o.rate != null ? (o.rate*100).toFixed(0) + '%' : '—'}</span></td>
            </tr>`).join('')}
          </tbody>
        </table>

        <div class="stat-label" style="margin:14px 0 6px;">recent matches (newest first)</div>
        <table>
          <thead><tr>
            <th>upd</th><th>opponent</th><th>Elo</th><th>level</th>
            <th>W</th><th>D</th><th>L</th><th>rate</th><th>wall (s)</th>
          </tr></thead>
          <tbody>
            ${recent.map(m => `<tr>
              <td><span class="mono">${m.update ?? '—'}</span></td>
              <td><span class="mono small">${esc(m.opp_id_short ?? '')}</span> ${esc(m.opp_label ?? '')}</td>
              <td><span class="mono">${m.opp_elo != null ? m.opp_elo.toFixed(0) : '—'}</span></td>
              <td><span class="mono">${esc(m.level ?? '')}</span></td>
              ${m.error ? `<td colspan="5" class="error mono small">${esc(m.error)}</td>` : `
                <td><span class="win mono">${m.p1_wins}</span></td>
                <td><span class="draw mono">${m.draws}</span></td>
                <td><span class="lose mono">${m.p2_wins}</span></td>
                <td><span class="mono">${m.win_rate != null ? (m.win_rate*100).toFixed(0) + '%' : '—'}</span></td>
                <td><span class="muted mono">${m.wall_s != null ? m.wall_s.toFixed(2) : '—'}</span></td>
              `}
            </tr>`).join('')}
          </tbody>
        </table>
      `;
    }

    /** Training opponent over time — shows what the agent played against
     * during each phase of training. Compresses runs of the same label. */
    function renderTrainingOpp(points) {
      const $card = document.getElementById('training-opp');
      if (!$card) return;
      const labeled = points
        .map((p, i) => ({ update: i + 1, label: p.training_opp_label }))
        .filter(p => p.label != null);
      if (!labeled.length) {
        $card.innerHTML = '<div class="muted">no opponent labels recorded yet.</div>';
        return;
      }
      const spans = [];
      let cur = null;
      for (const r of labeled) {
        if (cur && cur.label === r.label) {
          cur.end = r.update;
        } else {
          if (cur) spans.push(cur);
          cur = { label: r.label, start: r.update, end: r.update };
        }
      }
      if (cur) spans.push(cur);

      const colors = ['#f472b6', '#60a5fa', '#34d399', '#fbbf24', '#c084fc',
                      '#22d3ee', '#fb923c', '#a78bfa', '#facc15', '#a3e635'];
      const labelToColor = {};
      let ci = 0;
      for (const s of spans) {
        if (!(s.label in labelToColor)) labelToColor[s.label] = colors[ci++ % colors.length];
      }

      const lastUpd = labeled[labeled.length - 1].update;
      const stripe = spans.map(s => {
        const left = ((s.start - 1) / lastUpd) * 100;
        const width = ((s.end - s.start + 1) / lastUpd) * 100;
        return `<div title="${esc(s.label)} (u${s.start}-u${s.end})" style="
          position:absolute; left:${left}%; width:${width}%; top:0; bottom:0;
          background:${labelToColor[s.label]}; opacity:0.85;"></div>`;
      }).join('');

      const legend = Object.entries(labelToColor).map(([lab, col]) =>
        `<span style="display:inline-flex; align-items:center; gap:6px; margin-right:14px;">
          <span style="width:10px; height:10px; background:${col}; display:inline-block; border-radius:2px;"></span>
          <span class="mono small">${esc(lab)}</span>
        </span>`).join('');

      $card.innerHTML = `
        <div class="stat-label" style="margin-bottom:6px;">timeline (x = update, color = opponent)</div>
        <div style="position:relative; height:32px; border-radius:4px; overflow:hidden; background:#1a1d27;">
          ${stripe}
        </div>
        <div style="margin-top:10px;">${legend}</div>
        <div class="muted small" style="margin-top:6px;">
          ${spans.length} segment${spans.length === 1 ? '' : 's'} across ${lastUpd} updates
        </div>
      `;
    }

    /** Level distribution — flat list of every level the agent saw, with the
     * percentage of updates that level_mix held. Aggregated across the run. */
    function renderLevelMix(points) {
      const $card = document.getElementById('level-mix');
      if (!$card) return;
      const weighted = {};
      let nRows = 0;
      for (const p of points) {
        const mix = p.level_mix_resolved;
        if (!Array.isArray(mix) || !mix.length) continue;
        nRows++;
        const total = mix.reduce((s, x) => s + (x[1] || 0), 0) || 1;
        for (const [name, w] of mix) {
          weighted[name] = (weighted[name] || 0) + (w / total);
        }
      }
      if (!nRows) {
        $card.innerHTML = '<div class="muted">no level data recorded yet.</div>';
        return;
      }
      const rows = Object.entries(weighted)
        .map(([name, w]) => ({ name, share: w / nRows }))
        .sort((a, b) => b.share - a.share);

      $card.innerHTML = `
        <div class="stat-label" style="margin-bottom:8px;">aggregate level mix across ${nRows} updates</div>
        <table>
          <thead><tr><th>level</th><th>share</th></tr></thead>
          <tbody>
            ${rows.map(r => `<tr>
              <td><span class="mono">${esc(r.name)}</span></td>
              <td>
                <div style="display:flex; align-items:center; gap:8px;">
                  <div style="flex:1; height:8px; background:#1a1d27; border-radius:2px; overflow:hidden;">
                    <div style="width:${(r.share*100).toFixed(1)}%; height:100%; background:#60a5fa;"></div>
                  </div>
                  <span class="mono" style="min-width:54px; text-align:right;">${(r.share*100).toFixed(1)}%</span>
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      `;
    }

    /** Hyperparameters panel — groups PPOConfig fields by purpose so it's
     * skimmable instead of a wall of JSON. Unknown keys (anything not in a
     * known group) get dumped into a "misc" footer so we never lose info.
     * Each known key gets a third column explaining what it controls. */
    const HP_DESCRIPTIONS = {
      // Rollout
      n_envs:         'Parallel sim envs per rollout. Higher = more samples per update, more GPU pressure.',
      rollout_steps:  'Steps per env per rollout. Total samples per update = n_envs × rollout_steps.',
      fused_rollout:  'Single XLA-batched rollout (jax backend) instead of per-tick Python loop. Big throughput win.',
      action_repeat:  'K env ticks per agent decision under fused rollout. K>1 = cheaper, less reactive.',
      vec_mode:       'Vec env backend: "async" (subprocess per env) or "sync" (in-process loop).',
      // PPO
      lr:             'Adam learning rate. Too high → policy collapse; too low → no progress.',
      gamma:          'Discount factor for future rewards. Closer to 1 = more long-horizon credit assignment.',
      gae_lambda:     'GAE bias/variance tradeoff. 1.0 = unbiased Monte Carlo; 0.0 = pure TD bootstrap.',
      clip_range:     'PPO ratio clip ε. Limits per-update policy change; smaller = more conservative.',
      value_coef:     'Weight on the value (critic) loss in the joint objective.',
      entropy_coef:   'Bonus on policy entropy. Higher = more exploration; too high = won’t commit to anything.',
      max_grad_norm:  'Global gradient-norm clip. Caps a single update’s magnitude during instability.',
      minibatch_size: 'Samples per SGD step inside an update. Smaller = more steps per epoch, more noise.',
      update_epochs:  'Passes over the rollout buffer per update. More = more squeeze per sample, more risk of overfitting that batch.',
      // Reward + obs
      reward_v13:        'Legacy boolean: True → reward v1.3, False → v1.2. Overridden by reward_version when set.',
      reward_version:    'Reward scheme version. -1=unset (use reward_v13). 0=v1.2, 1=v1.3, 2=v1.4 (per-tick shaping on buildings + units).',
      normalize_obs:     'Welford running mean/std normalisation on obs. True = stabler critic.',
      obs_clip:          'Clip normalised obs to ±this value (None disables). Guards against early-training outliers.',
      // Self-play
      self_play:         'If false, opponent stays random_legal forever. If true, snapshots feed the opponent pool.',
      snapshot_every:    'Updates between adding the current policy to the self-play pool.',
      pool_max_size:     'Max snapshots in the pool. Older snapshots evicted FIFO once exceeded.',
      latest_bias:       'P(env samples the latest snapshot). Remainder draws uniformly from older snapshots.',
      initial_opponent:  'Opponent used before the first self-play snapshot registers.',
      leaderboard_bias:  'P(env uses a cross-lineage champion instead of own pool). 0.3 ≈ 30% leaderboard, 70% own.',
      leaderboard_top_k: 'How many top champions to draw from when leaderboard slot fires.',
      leaderboard_source:'"pfsp" (default, peak at 50% win-rate) or "elo" (legacy top-K-Elo).',
      // Archive eval
      archive_eval_every:    'Updates between archive eval rounds. Rounds the curve in the dashboard.',
      archive_eval_top_n:    'How many top-Elo champions are evaluated each round.',
      archive_eval_games:    'Games played per opponent per eval round.',
      archive_eval_level:    'Level used for archive eval. None = same as training level (apples-to-apples).',
      archive_eval_min_pool: 'Skip archive eval until this many champions exist.',
      archive_eval_max_ticks:'Per-game tick cap during archive eval. Prevents stuck games eating wall time.',
      // Opponent
      opponent_name:   'Initial opponent type ("random_legal", "neural", etc.). Self-play replaces this after first snapshot.',
      opponent_kwargs: 'Extra kwargs for the initial opponent. Used when opponent_name="neural" with a fixed weight path.',
      // Level
      level_name:      'Training level. "random_<min>_<max>" regenerates per reset; static names reuse the same map.',
      level_mix:       'List of (level_name, weight) pairs sampled per env reset. Overrides level_name when set.',
    };

    function renderHyperparams(hp) {
      const $card = document.getElementById('hyperparams-panel');
      if (!$card) return;
      if (!hp || typeof hp !== 'object') {
        $card.innerHTML = '<div class="muted">no hyperparams recorded for this run.</div>';
        return;
      }

      // Group definitions: [section title, [key, key, ...]]. Order matters.
      const GROUPS = [
        ['Rollout',         ['n_envs', 'rollout_steps', 'fused_rollout', 'action_repeat', 'vec_mode']],
        ['PPO',             ['lr', 'gamma', 'gae_lambda', 'clip_range', 'value_coef', 'entropy_coef',
                             'max_grad_norm', 'minibatch_size', 'update_epochs']],
        ['Reward + obs',    ['reward_v13', 'reward_version', 'normalize_obs', 'obs_clip']],
        ['Self-play',       ['self_play', 'snapshot_every', 'pool_max_size', 'latest_bias',
                             'initial_opponent', 'leaderboard_bias', 'leaderboard_top_k', 'leaderboard_source']],
        ['Archive eval',    ['archive_eval_every', 'archive_eval_top_n', 'archive_eval_games',
                             'archive_eval_level', 'archive_eval_min_pool', 'archive_eval_max_ticks']],
        ['Opponent',        ['opponent_name', 'opponent_kwargs']],
        ['Level',           ['level_name', 'level_mix']],
      ];

      const seen = new Set();
      let html = '';
      const renderRow = (k, v) => `<tr>
        <td style="width:200px; vertical-align:top;"><span class="mono small muted">${esc(k)}</span></td>
        <td style="width:240px; vertical-align:top;"><span class="mono">${esc(formatHpValue(v))}</span></td>
        <td style="vertical-align:top;"><span class="muted small">${esc(HP_DESCRIPTIONS[k] ?? '')}</span></td>
      </tr>`;
      for (const [title, keys] of GROUPS) {
        const rows = keys
          .filter(k => Object.prototype.hasOwnProperty.call(hp, k))
          .map(k => { seen.add(k); return [k, hp[k]]; });
        if (!rows.length) continue;
        html += `
          <div class="stat-label" style="margin:6px 0 4px;">${esc(title)}</div>
          <table style="margin-bottom:12px;">
            <thead><tr>
              <th style="width:200px;">key</th>
              <th style="width:240px;">value</th>
              <th>meaning</th>
            </tr></thead>
            <tbody>${rows.map(([k, v]) => renderRow(k, v)).join('')}</tbody>
          </table>
        `;
      }

      const misc = Object.entries(hp).filter(([k]) => !seen.has(k));
      if (misc.length) {
        html += `
          <div class="stat-label" style="margin:6px 0 4px;">Other</div>
          <table>
            <thead><tr>
              <th style="width:200px;">key</th>
              <th style="width:240px;">value</th>
              <th>meaning</th>
            </tr></thead>
            <tbody>${misc.map(([k, v]) => renderRow(k, v)).join('')}</tbody>
          </table>
        `;
      }

      // Full raw config — open by default so the run is fully self-describing.
      // Catches any new fields (rewards, experimental flags) without needing
      // a code change in this file.
      html += `
        <details open style="margin-top:16px;">
          <summary class="stat-label" style="cursor:pointer;">Full configuration (raw JSON)</summary>
          <pre style="margin-top:8px;">${esc(JSON.stringify(hp, null, 2))}</pre>
        </details>
      `;

      $card.innerHTML = html;
    }

    function formatHpValue(v) {
      if (v === null || v === undefined) return '—';
      if (typeof v === 'object') return JSON.stringify(v);
      if (typeof v === 'boolean') return v ? 'true' : 'false';
      if (typeof v === 'number') {
        // Trim trailing zeros for floats; leave ints alone.
        if (Number.isInteger(v)) return String(v);
        return v.toFixed(6).replace(/\.?0+$/, '');
      }
      return String(v);
    }

    /** Reward scheme panel — resolves the reward version from hyperparams and
     * shows the actual scalar values (capture, win, lose, draw, speed bonus,
     * per-tick shaping) alongside the PPO discount γ. Source of truth:
     * sim/config.py REWARD_*_BY_VERSION tuples (mirrored here so the dashboard
     * is self-contained). Update both when a new reward version ships. */
    const REWARD_TABLES = {
      // [v1.2, v1.3, v1.4]
      capture:        [0.1,   0.05,  0.05],
      lose_building:  [-0.1,  -0.05, -0.05],
      win:            [1.0,   5.0,   5.0],
      lose:           [-1.0,  -5.0,  -5.0],
      draw:           [0.0,   -0.5,  -0.5],
      speed_bonus:    [0.5,   2.0,   2.0],
      tick_buildings: [0.0,   0.0,   0.0010],
      tick_units:     [0.0,   0.0,   0.0002],
    };
    function renderRewardScheme(hp) {
      const $card = document.getElementById('reward-panel');
      if (!$card) return;
      // Resolve version: reward_version wins if ≥0, else fall back to reward_v13.
      let v = hp.reward_version;
      if (v == null || v < 0) v = hp.reward_v13 ? 1 : 0;
      v = Math.max(0, Math.min(2, v|0));
      const versionLabel = ['v1.2', 'v1.3', 'v1.4'][v];
      const t = REWARD_TABLES;
      const fmt = (x) => Number.isInteger(x) ? String(x) : (x === 0 ? '0' : x.toString());
      const sign = (x) => x > 0 ? `+${fmt(x)}` : fmt(x);
      const gamma = hp.gamma ?? 0.99;

      const rows = [
        ['Capture building',    sign(t.capture[v]),       'each time you take an enemy / neutral building'],
        ['Lose building',       sign(t.lose_building[v]), 'each time the opponent takes one of yours'],
        ['Win the game',        sign(t.win[v]),           'terminal — paid once on game end (winner)'],
        ['Speed bonus (winner)', `up to +${fmt(t.speed_bonus[v])}`,
                                 `added to win reward, scaled by (1 − tick/timeout). Win at tick 0 → full bonus; at timeout → 0.`],
        ['Lose the game',       sign(t.lose[v]),          'terminal — paid once on game end (loser)'],
        ['Draw',                sign(t.draw[v]),          'terminal — paid to both on timeout'],
        ['Per-tick building Δ', v === 2 ? `±${fmt(t.tick_buildings[v])} × (own − opp buildings)` : '0',
                                 v === 2 ? 'every tick, both players (symmetric). v1.4 only.' : 'disabled in this reward version'],
        ['Per-tick unit Δ',     v === 2 ? `±${fmt(t.tick_units[v])} × (own − opp real units)` : '0',
                                 v === 2 ? 'every tick, both players (symmetric). v1.4 only.' : 'disabled in this reward version'],
        ['Discount γ',          fmt(gamma),               'PPO future-reward discount per step. Closer to 1 = patient (long-horizon credit). With speed bonus, agent is incentivised to win quickly anyway.'],
      ];

      $card.innerHTML = `
        <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
          <div><span class="stat-label">reward version</span><div class="stat mono">${versionLabel}</div></div>
          <div><span class="stat-label">discount γ</span><div class="stat mono">${fmt(gamma)}</div></div>
          <div><span class="stat-label">winning fast pays more</span><div class="mono small">+${fmt(t.win[v])} terminal +up to ${fmt(t.speed_bonus[v])} speed</div></div>
        </div>
        <table>
          <thead><tr>
            <th style="width:200px;">event</th>
            <th style="width:240px;">reward</th>
            <th>when / how</th>
          </tr></thead>
          <tbody>
            ${rows.map(([e, val, desc]) => `<tr>
              <td><span class="mono small">${esc(e)}</span></td>
              <td><span class="mono">${esc(val)}</span></td>
              <td><span class="muted small">${esc(desc)}</span></td>
            </tr>`).join('')}
          </tbody>
        </table>
        <div class="muted small" style="margin-top:8px;">
          Source: <span class="mono">sim/config.py</span> <span class="mono">REWARD_*_BY_VERSION</span>.
          Reward version selection: <span class="mono">reward_version</span> wins if ≥0, otherwise falls back to <span class="mono">reward_v13</span>.
        </div>
      `;
    }

    /** Win rate progression in 10% buckets across the run.
     * Buckets are pinned to budget wall-clock, NOT to the current point count —
     * so the first bucket is always "first 10% of the budgeted run", and old
     * points don't migrate buckets as new ones come in. Mid-run, late buckets
     * are simply empty until that wall-clock window is reached.
     *
     * Two parallel breakdowns:
     *   1. Training-rollout (B): aggregate win_rate per bucket, grouped by
     *      training_opp_label so opponent swaps mid-run are visible.
     *   2. Eval-matches (A): per-opponent eval win rate per bucket, sorted by
     *      Elo. Sparse — only the buckets that contained eval updates light up. */
    function renderWinRateProgression(points, run) {
      const $card = document.getElementById('win-rate-progression');
      if (!$card) return;
      if (!points || !points.length) {
        $card.innerHTML = '<div class="muted">no metrics yet.</div>';
        return;
      }

      const N_BUCKETS = 10;
      const total = points.length;
      // Bucket by fraction-of-budget. We don't have per-point wall_ms, so we
      // assume points are emitted at a roughly steady cadence and project
      // each point's index onto the budget timeline:
      //   fraction = (i / (total-1)) * (run.wall_ms / run.budget_ms)
      // For a completed run (wall_ms ≈ budget_ms) this collapses to i/total
      // (the old behaviour). Mid-run it pins early points to early buckets.
      const wallMs   = run?.wall_ms;
      const budgetMs = run?.budget_ms;
      const denom    = Math.max(total - 1, 1);
      const useBudget = wallMs > 0 && budgetMs > 0;
      const progress  = useBudget ? Math.min(1, wallMs / budgetMs) : 1;
      const bucketOf = (i) => {
        const frac = (i / denom) * progress;
        return Math.min(N_BUCKETS - 1, Math.floor(N_BUCKETS * frac));
      };

      // ---- (B) Training-rollout: per-update win rate ----------------------
      // Each metrics row is exactly ONE PPO update; under opponent_pool_mode
      // =rotate_per_update, every update faces a (potentially) different
      // opponent. Render one column per update, left-to-right by update index.
      // trainPerUpdate[i][opp_label] = { wins, n }   (sparse — typically one
      // opp per column under rotation mode).
      const trainPerUpdate = points.map(() => ({}));
      let anyTrain = false;
      points.forEach((p, i) => {
        const lab = p.training_opp_label;
        const wr  = p.win_rate;
        const eps = p.episodes_completed;
        if (lab == null || wr == null || !eps) return;
        anyTrain = true;
        trainPerUpdate[i][lab] = { wins: wr * eps, n: eps };
      });
      const trainOpps = new Set();
      for (const u of trainPerUpdate) for (const lab of Object.keys(u)) trainOpps.add(lab);

      // ---- (A) Eval matches: per-(bucket, opponent) win rate from eval_matches.
      // Time bucket is determined by the eval_match's `update` field, mapped to
      // the metric-row index that holds it.
      const evalBuckets = Array.from({length: N_BUCKETS}, () => ({}));
      let anyEval = false;
      points.forEach((p, i) => {
        const arr = p.eval_matches;
        if (!Array.isArray(arr) || !arr.length) return;
        const b = bucketOf(i);
        for (const m of arr) {
          if (m.error) continue;
          anyEval = true;
          const k = m.opp_id_short || m.opp_label || '?';
          const slot = evalBuckets[b][k] = evalBuckets[b][k] || {
            label: m.opp_label, elo: m.opp_elo, w: 0, l: 0, d: 0, n: 0,
          };
          slot.w += m.p1_wins || 0;
          slot.l += m.p2_wins || 0;
          slot.d += m.draws   || 0;
          slot.n += m.total   || 0;
        }
      });

      // Red (0°) → yellow (60°) → green (120°). HSL ramp: 0% → red, 50% → yellow, 100% → green.
      // Saturation 65% / lightness 42% reads cleanly on the dark theme; alpha 0.55 keeps
      // the cell text legible on top.
      const cellColor = (wr) => {
        if (wr == null) return 'transparent';
        const t = Math.max(0, Math.min(1, wr));
        const hue = Math.round(120 * t);
        return `hsla(${hue}, 65%, 42%, 0.55)`;
      };
      const fmtRate = (wr, n) => wr == null
        ? '<span class="muted small">—</span>'
        : `<div class="mono" style="font-size:11px; line-height:1.1;">
             <div>${(wr*100).toFixed(0)}%</div>
             <div class="muted" style="font-size:9px;">n=${n}</div>
           </div>`;

      // ---- (B) Training-rollout table HTML --------------------------------
      let trainHtml = '';
      if (anyTrain) {
        const opps = Array.from(trainOpps);
        trainHtml = `
          <div class="stat-label" style="margin-bottom:8px;">
            Win rate vs the opponent the agent played each PPO update. One column per update, left → right. <span class="mono">n=</span> is episodes completed in that update.
          </div>
          <div style="overflow-x:auto;">
          <table>
            <thead><tr>
              <th>opponent</th>
              ${trainPerUpdate.map((_, i) => `<th>${i+1}</th>`).join('')}
            </tr></thead>
            <tbody>
              ${opps.map(opp => {
                const cells = trainPerUpdate.map(u => {
                  const s = u[opp];
                  if (!s || s.n === 0) return `<td style="text-align:center;">${fmtRate(null)}</td>`;
                  const wr = s.wins / s.n;
                  return `<td style="text-align:center; background:${cellColor(wr)};">${fmtRate(wr, Math.round(s.n))}</td>`;
                }).join('');
                return `<tr><td><span class="mono">${esc(opp)}</span></td>${cells}</tr>`;
              }).join('')}
            </tbody>
          </table>
          </div>
        `;
      } else {
        trainHtml = '<div class="muted">no training-rollout win rate data yet.</div>';
      }

      // ---- (A) Eval-match table HTML --------------------------------------
      let evalHtml = '';
      if (anyEval) {
        const oppMeta = {};
        for (const b of evalBuckets) {
          for (const [k, v] of Object.entries(b)) {
            if (!(k in oppMeta) || (oppMeta[k].elo ?? -1e9) < (v.elo ?? -1e9)) {
              oppMeta[k] = { id: k, label: v.label, elo: v.elo };
            }
          }
        }
        const opps = Object.values(oppMeta)
          .sort((a, b) => (b.elo ?? -1e9) - (a.elo ?? -1e9));
        evalHtml = `
          <div class="stat-label" style="margin-bottom:8px;">
            Win rate vs each top-Elo champion in the archive, bucketed by 10% slices of training. Sparse — only buckets with eval updates light up. <span class="mono">n=</span> is games played that bucket.
          </div>
          <div style="overflow-x:auto;">
          <table>
            <thead><tr>
              <th>opponent</th><th>Elo</th>
              ${evalBuckets.map((_, i) => `<th>${i*10}–${(i+1)*10}%</th>`).join('')}
            </tr></thead>
            <tbody>
              ${opps.map(o => {
                const cells = evalBuckets.map(b => {
                  const s = b[o.id];
                  if (!s || s.n === 0) return `<td style="text-align:center;">${fmtRate(null)}</td>`;
                  const wr = (s.w + 0.5 * s.d) / s.n;
                  return `<td style="text-align:center; background:${cellColor(wr)};">${fmtRate(wr, s.n)}</td>`;
                }).join('');
                return `<tr>
                  <td><span class="mono small">${esc(o.id ?? '')}</span> ${esc(o.label ?? '')}</td>
                  <td><span class="mono">${o.elo != null ? o.elo.toFixed(0) : '—'}</span></td>
                  ${cells}
                </tr>`;
              }).join('')}
            </tbody>
          </table>
          </div>
        `;
      } else {
        evalHtml = '<div class="muted">no archive-eval data yet — populated once <span class="mono">archive_eval_every</span> triggers.</div>';
      }

      if (!anyTrain && !anyEval) {
        $card.innerHTML = '<div class="muted">no win rate data yet — populated as the run produces metrics.</div>';
        return;
      }

      // Render with tab strip. Default tab = training (always populated first).
      $card.innerHTML = `
        <div class="wrp-tabs" style="display:flex; gap:0; border-bottom:1px solid #2a2f3d; margin-bottom:14px;">
          <button data-tab="train" class="wrp-tab" style="padding:8px 14px; background:transparent; border:0; border-bottom:2px solid transparent; color:#aab; cursor:pointer; font:inherit;">Training rollouts</button>
          <button data-tab="eval"  class="wrp-tab" style="padding:8px 14px; background:transparent; border:0; border-bottom:2px solid transparent; color:#aab; cursor:pointer; font:inherit;">Archive eval</button>
        </div>
        <div class="wrp-pane" data-pane="train">${trainHtml}</div>
        <div class="wrp-pane" data-pane="eval" style="display:none;">${evalHtml}</div>
      `;
      const tabs = $card.querySelectorAll('.wrp-tab');
      const panes = $card.querySelectorAll('.wrp-pane');
      const activate = (name) => {
        tabs.forEach(t => {
          const on = t.dataset.tab === name;
          t.style.color = on ? '#fff' : '#aab';
          t.style.borderBottomColor = on ? '#a78bfa' : 'transparent';
        });
        panes.forEach(p => { p.style.display = p.dataset.pane === name ? '' : 'none'; });
      };
      tabs.forEach(t => t.addEventListener('click', () => activate(t.dataset.tab)));
      activate('train');
    }

    /** Render one mini line chart per level seen in `win_rate_by_level`.
     * Hidden entirely when no level breakdown is available (old runs or
     * level_mix-trained runs that don't currently emit per-level). */
    function renderPerMap(points) {
      const $h2  = document.getElementById('permap-h2');
      const $card = document.getElementById('permap-card');
      const $grid = document.getElementById('permap-grid');
      if (!$h2 || !$card || !$grid) return;

      // Collect the union of levels seen across all updates.
      const levels = new Set();
      for (const p of points) {
        const m = p.win_rate_by_level;
        if (m && typeof m === 'object') {
          for (const k of Object.keys(m)) levels.add(k);
        }
      }
      if (levels.size === 0) {
        $h2.style.display = 'none';
        $card.style.display = 'none';
        return;
      }
      $h2.style.display = '';
      $card.style.display = '';

      // Re-render the grid; destroy any previous per-level charts first.
      for (const k of [...charts.keys()]) {
        if (k.startsWith('chart-permap-')) {
          charts.get(k).destroy();
          charts.delete(k);
        }
      }
      $grid.innerHTML = '';
      const sorted = [...levels].sort();
      for (const level of sorted) {
        const id = `chart-permap-${level.replace(/[^a-z0-9_]/gi, '_')}`;
        const slot = document.createElement('div');
        slot.innerHTML = `
          <div class="stat-label" style="margin-bottom:4px;"><span class="mono">${level}</span></div>
          <div style="position:relative; height:140px;"><canvas id="${id}"></canvas></div>
        `;
        $grid.appendChild(slot);
        // Project the per-level series onto the same x axis as the main
        // metrics — points without this level become null gaps.
        const projected = points.map(p => {
          const m = p.win_rate_by_level;
          return { win_rate: (m && m[level] != null) ? m[level] : null };
        });
        const canvas = document.getElementById(id);
        if (canvas) {
          try {
            charts.set(id, lineChart(canvas, projected, ['win_rate'],
              { yLabel: '', xLabel: '', yMin: 0, yMax: 1 }));
          } catch (e) {
            canvas.replaceWith(Object.assign(document.createElement('div'),
              { className: 'error', textContent: e.message }));
          }
        }
      }
    }

    async function loadMatchups(runId) {
      const $panel = document.getElementById('matchups');
      if (!$panel) return;

      // All games where this run was one of the players.
      const { data: games, error } = await sb
        .from('games')
        .select('player_1_run_id, player_2_run_id, winner, map_name')
        .or(`player_1_run_id.eq.${runId},player_2_run_id.eq.${runId}`);
      if (error) { $panel.innerHTML = `<div class="error">${esc(error.message)}</div>`; return; }
      if (!games || games.length === 0) {
        $panel.innerHTML = '<div class="muted">no evaluation games yet — auto-admission queues them when training finishes, or queue manually via <span class="inline-code">cli/queue_eval.py</span></div>';
        return;
      }

      // Fetch labels for every distinct opponent id encountered.
      const oppIds = Array.from(new Set(games.flatMap(g =>
        [g.player_1_run_id, g.player_2_run_id].filter(id => id !== runId))));
      const { data: oppRows } = await sb
        .from('runs')
        .select('id, label, model_id')
        .in('id', oppIds);
      const labelOf = Object.fromEntries((oppRows || []).map(r => [r.id, r]));

      // Aggregate per-opponent.
      const byOpp = {};  // opp_id → { wins, losses, draws }
      let tot_w = 0, tot_l = 0, tot_d = 0;
      for (const g of games) {
        const oppId = g.player_1_run_id === runId ? g.player_2_run_id : g.player_1_run_id;
        const bucket = byOpp[oppId] = byOpp[oppId] || { w: 0, l: 0, d: 0 };
        if (g.winner === runId)            { bucket.w++; tot_w++; }
        else if (g.winner === null)        { bucket.d++; tot_d++; }
        else                               { bucket.l++; tot_l++; }
      }
      const rows = Object.entries(byOpp).map(([oppId, s]) => {
        const n = s.w + s.l + s.d;
        const oppLabel = labelOf[oppId]?.label ?? `(${oppId.slice(0, 8)}…)`;
        const oppLink = oppId === '00000000-0000-0000-0000-000000000001'
          ? `<span class="mono">${esc(oppLabel)}</span>`
          : `<a href="./run.html?id=${esc(oppId)}">${esc(oppLabel)}</a>`;
        return { oppId, oppLink, n, w: s.w, l: s.l, d: s.d,
                 rate: (s.w + 0.5 * s.d) / n };
      }).sort((a, b) => b.rate - a.rate);

      const totalN = tot_w + tot_l + tot_d;
      const overallRate = totalN > 0 ? (tot_w + 0.5 * tot_d) / totalN : 0;
      $panel.innerHTML = `
        <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
          <div><span class="stat-label">eval games</span><div class="stat">${totalN}</div></div>
          <div><span class="stat-label">opponents</span><div class="stat">${rows.length}</div></div>
          <div><span class="stat-label">overall win rate</span><div class="stat">${(overallRate * 100).toFixed(1)}%</div></div>
          <div><span class="stat-label">W / D / L</span><div class="mono">${tot_w} / ${tot_d} / ${tot_l}</div></div>
        </div>
        <table>
          <thead><tr>
            <th>opponent</th><th>games</th><th>W</th><th>D</th><th>L</th>
            <th>win rate</th><th>share</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => tr([
              r.oppLink,
              `<span class="mono">${r.n}</span>`,
              `<span class="win mono">${r.w}</span>`,
              `<span class="draw mono">${r.d}</span>`,
              `<span class="lose mono">${r.l}</span>`,
              `<span class="mono">${(r.rate * 100).toFixed(0)}%</span>`,
              `<span class="muted mono">${((r.n / totalN) * 100).toFixed(0)}%</span>`,
            ])).join('')}
          </tbody>
        </table>
        <div class="muted small" style="margin-top:8px;">
          Sorted by win rate. "Share" = % of this run's eval games against that opponent.
        </div>
      `;
    }

    // Levels offered in the attribution form. Must satisfy the regex in
    // queue_attribution_job (infra/attribution_jobs.sql).
    const FI_LEVEL_OPTIONS = [
      'random_4_8', 'random_6_10', 'random_8_16', 'random_16_24',
      'random_close_4_5', 'random_close_4_6', 'random_close_6_10',
      'asym_8_8', 'crossroads_6',
    ];

    function renderFiControls(runId, defaultLevel, hasData, statusHtml) {
      const opts = FI_LEVEL_OPTIONS.map(l =>
        `<option value="${esc(l)}"${l === defaultLevel ? ' selected' : ''}>${esc(l)}</option>`
      ).join('');
      const btnLabel = hasData ? 'Recompute' : 'Compute attributions';
      return `
        <div class="fi-controls">
          <label>level
            <select id="fi-level">${opts}</select>
          </label>
          <label>games
            <input id="fi-games" type="number" min="1" max="256" value="16">
          </label>
          <button id="fi-submit">${btnLabel}</button>
          <span class="fi-status" id="fi-status">${statusHtml || ''}</span>
        </div>`;
    }

    async function submitAttributionJob(runId) {
      const level = document.getElementById('fi-level').value;
      const games = parseInt(document.getElementById('fi-games').value, 10) || 16;
      const $btn = document.getElementById('fi-submit');
      const $status = document.getElementById('fi-status');
      $btn.disabled = true;
      $status.className = 'fi-status running';
      $status.textContent = 'queueing…';

      const { data, error } = await sb.rpc('queue_attribution_job', {
        p_run_id: runId, p_level: level, p_n_games: games,
      });
      if (error) {
        $status.className = 'fi-status failed';
        $status.textContent = `queue failed: ${error.message}`;
        $btn.disabled = false;
        return;
      }
      const jobId = data;
      $status.textContent = `queued (job ${jobId.slice(0, 8)}…), waiting for worker…`;

      // Poll the job row every 3s until terminal.
      const poll = setInterval(async () => {
        const { data: row, error: pollErr } = await sb
          .from('attribution_jobs')
          .select('status, machine, error, n_states, started_at, finished_at')
          .eq('id', jobId).single();
        if (pollErr) {
          $status.textContent = `poll failed: ${pollErr.message}`;
          $status.className = 'fi-status failed';
          clearInterval(poll); $btn.disabled = false; return;
        }
        if (row.status === 'queued') {
          $status.textContent = `queued, waiting for worker…`;
        } else if (row.status === 'running') {
          $status.className = 'fi-status running';
          $status.textContent = `running on ${row.machine}…`;
        } else if (row.status === 'done') {
          $status.className = 'fi-status done';
          $status.textContent = `done (${row.n_states} states on ${row.machine}) — refreshing`;
          clearInterval(poll);
          // Refresh the panel — preserves form open + repopulates bars.
          await loadFeatureImportance(runId);
        } else if (row.status === 'failed') {
          $status.className = 'fi-status failed';
          $status.textContent = `failed: ${(row.error || '').split('\n')[0]}`;
          clearInterval(poll); $btn.disabled = false;
        }
      }, 3000);
    }

    async function loadFeatureImportance(runId) {
      const $panel = document.getElementById('feature-importance');
      if (!$panel) return;

      // Run's training level is the natural default for the form.
      const { data: runRow } = await sb.from('runs')
        .select('hyperparams').eq('id', runId).single();
      const defaultLevel = runRow?.hyperparams?.level_name || 'random_8_16';

      const { data, error } = await sb
        .from('run_feature_importance')
        .select('feature_block, feature_index, feature_name, ig_mean_abs, ig_mean_signed, ig_std, weight_l2, n_states')
        .eq('run_id', runId)
        .order('ig_mean_abs', { ascending: false });
      if (error) { $panel.innerHTML = `<div class="error">${esc(error.message)}</div>`; return; }

      const hasData = data && data.length > 0;
      const controls = renderFiControls(runId, defaultLevel, hasData, '');

      if (!hasData) {
        $panel.innerHTML = `
          ${controls}
          <div class="muted">
            no attributions computed yet — pick a level + games above and click
            <strong>Compute attributions</strong>. Any worker (Mac or PaulLinux) will pick it up.
          </div>`;
        document.getElementById('fi-submit').addEventListener('click',
          () => submitAttributionJob(runId));
        return;
      }

      const blockColor = { globals: '#60a5fa', building: '#34d399', group: '#a78bfa' };
      const maxAbs = Math.max(...data.map(r => r.ig_mean_abs));
      const nStates = data[0].n_states;

      const rows = data.map(r => {
        const pct = maxAbs > 0 ? (r.ig_mean_abs / maxAbs) * 100 : 0;
        const sign = r.ig_mean_signed >= 0 ? '+' : '';
        const color = blockColor[r.feature_block] || '#888';
        return `
          <div class="fi-row">
            <span class="fi-tag" style="background:${color}22;color:${color}">${esc(r.feature_block)}</span>
            <span class="fi-name">${esc(r.feature_name)}</span>
            <div class="fi-bar"><div class="fi-bar-fill" style="width:${pct.toFixed(1)}%;background:${color}"></div></div>
            <span class="fi-num">${r.ig_mean_abs.toFixed(3)}</span>
            <span class="fi-num muted">${sign}${r.ig_mean_signed.toFixed(3)}</span>
            <span class="fi-num muted wl2-col">${r.weight_l2.toFixed(2)}</span>
          </div>`;
      }).join('');

      $panel.innerHTML = `
        ${controls}
        <div class="fi-help">
          What drives this run's <strong>value head</strong> — the agent's expected-return estimate.
          <strong>Mean |IG|</strong> is the Integrated-Gradients attribution averaged over
          ${nStates} sampled decision states (self-play mirror match on the level above; both
          P1 and P2 perspectives collected). Building/group features are summed across the 32 slots.
          <strong>Signed</strong> shows direction (+ raises value, − lowers).
          <strong>wL2</strong> = layer-1 column norm — capacity to use a feature, not actual use; often disagrees with |IG|.
        </div>
        <div class="fi-header">
          <span>block</span><span>feature</span><span></span>
          <span class="fi-num">|IG|</span>
          <span class="fi-num">signed</span>
          <span class="fi-num wl2-col">wL2</span>
        </div>
        <div class="fi-list">${rows}</div>
      `;
      document.getElementById('fi-submit').addEventListener('click',
        () => submitAttributionJob(runId));
    }

    async function pollForUpdates(runId) {
      const chartIds = ['chart-win', 'chart-loss', 'chart-signal',
                        'chart-stability', 'chart-ev', 'chart-bands',
                        'chart-eps', 'chart-pool'];
      function failAllCharts(text) {
        for (const id of chartIds) replaceCanvasWith(id, text, true);
      }

      // Poll cadence: 3s for live runs (Paul fire 63 — short cells need
       // tight feedback). Worker uploads metrics every PPO update under
       // METRICS_UPLOAD_EVERY=1, so 3s polling captures most uploads.
      const POLL_MS = 3000;
      const timer = setInterval(async () => {
        const { data: run, error } = await sb.from('runs').select('status, log_url, games_played, wall_ms, budget_ms, result, hyperparams, elo_score, elo_n_matches').eq('id', runId).single();
        if (error) return;
        // Update header stats row.
        const gamesPerMin = (run.games_played && run.wall_ms) ? (run.games_played / (run.wall_ms / 60000)) : null;
        const statEls = document.querySelectorAll('.grid .card .stat');
        // Header grid order: rate, Elo, games, games/min, games/update, updates, ticks/min, total-ticks, wall
        if (statEls.length >= 9) {
          const u = run.result?.updates ?? 0;
          const gpu = (run.games_played && u) ? (run.games_played / u) : null;
          const sps = run.result?.steps_per_sec;
          const tt = totalTicks(run.result, run.hyperparams);
          statEls[0].textContent = (run.result?.rate != null) ? (run.result.rate * 100).toFixed(1) + '%' : '—';
          statEls[1].innerHTML    = fmtElo(run.elo_score, run.elo_n_matches);
          statEls[2].textContent = String(run.games_played ?? '—');
          statEls[3].textContent = gamesPerMin != null ? gamesPerMin.toFixed(0) : '—';
          statEls[4].textContent = gpu != null ? gpu.toFixed(1) : '—';
          statEls[5].textContent = String(u || '—');
          statEls[6].textContent = ticksPerMin(sps);
          statEls[7].textContent = fmtBig(tt);
          statEls[8].textContent = run.budget_ms ? fmtDurationShort(run.budget_ms) : '—';
        }
        // Refresh charts with the latest live log.
        await refreshCharts(signedUrl(run.log_url), chartIds, failAllCharts, run);
        // Stop polling once terminal.
        if (run.status === 'done' || run.status === 'failed') {
          clearInterval(timer);
        }
      }, POLL_MS);
    }

    function fmtDurationShort(ms) {
      const s = Math.round(ms / 1000);
      if (s < 60)   return `${s}s`;
      if (s < 3600) return `${Math.floor(s / 60)}m ${s % 60}s`;
      return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
    }
  </script>
