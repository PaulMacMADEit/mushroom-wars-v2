<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Runs — Mushroom Wars v2</title>
  <link rel="stylesheet" href="lib/style.css">
</head>
<body>
  <header>
    <h1>Mushroom Wars v2</h1>
    <nav>
      <a href="./index.html">Overview</a>
      <a href="./runs.html">Runs</a>
      <a href="./models.html">Models</a>
      <a href="./elo.html">Leaderboard</a>
      <a href="./training.html">Training</a>
      <a href="./launch.html">Launch</a>
      <a href="./replays.html">Replays</a>
      <a href="./play.html">Play</a>
      <a href="./play-live.html">Play Live</a>
      <a href="./process.html">Process</a>
    </nav>
  </header>

  <main>
    <h2>All runs</h2>

    <div class="card" style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;">
      <label class="small muted">status
        <br><select id="filter-status" style="background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:4px 8px;">
          <option value="">any (excl. discarded)</option>
          <option>queued</option>
          <option>running</option>
          <option>done</option>
          <option>failed</option>
          <option>discarded</option>
        </select>
      </label>
      <label class="small muted">machine
        <br><input id="filter-machine" placeholder="hostname…"
                   style="background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:4px 8px;">
      </label>
      <label class="small muted">label contains
        <br><input id="filter-label" placeholder="smoke…"
                   style="background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:4px 8px;">
      </label>
      <button id="refresh" style="background:var(--accent);color:#000;border:0;padding:6px 14px;border-radius:6px;cursor:pointer;">refresh</button>
    </div>

    <div class="card" id="runs">
      <div class="muted">Loading…</div>
    </div>
  </main>

  <script type="module">
    import { sb } from './lib/supabase.js';
    import { fmtTime, fmtDuration, fmtPct, esc, statusPill, tr,
             gamesPerSec, fmtParams, bottleneckPill,
             fmtElo, ticksPerMin } from './lib/ui.js';

    const $runs = document.getElementById('runs');
    const $status = document.getElementById('filter-status');
    const $machine = document.getElementById('filter-machine');
    const $label = document.getElementById('filter-label');
    const $refresh = document.getElementById('refresh');

    // Persist filters in URL hash + scroll position in sessionStorage so a
    // refresh / back-nav lands the user exactly where they were.
    const SCROLL_KEY = 'runs.scrollY';
    function readHashState() {
      const hash = window.location.hash.replace(/^#/, '');
      const params = new URLSearchParams(hash);
      return {
        status:  params.get('status')  ?? '',
        machine: params.get('machine') ?? '',
        label:   params.get('label')   ?? '',
      };
    }
    function writeHashState() {
      const params = new URLSearchParams();
      if ($status.value)        params.set('status',  $status.value);
      if ($machine.value.trim()) params.set('machine', $machine.value.trim());
      if ($label.value.trim())   params.set('label',   $label.value.trim());
      const next = params.toString();
      const url = next ? `#${next}` : window.location.pathname + window.location.search;
      history.replaceState(null, '', url);
    }
    // Restore filters from hash before first load() so the query reflects them.
    {
      const s = readHashState();
      $status.value  = s.status;
      $machine.value = s.machine;
      $label.value   = s.label;
    }
    // Save scroll on every scroll (cheap; sessionStorage is in-memory backed).
    let saveScrollPending = false;
    window.addEventListener('scroll', () => {
      if (saveScrollPending) return;
      saveScrollPending = true;
      requestAnimationFrame(() => {
        sessionStorage.setItem(SCROLL_KEY, String(window.scrollY));
        saveScrollPending = false;
      });
    }, { passive: true });

    async function load() {
      $runs.innerHTML = `<div class="muted">loading…</div>`;
      let q = sb.from('runs')
        .select('id, label, status, machine, model_id, simulator_id, seed, wall_ms, games_played, queued_at, result, elo_score, elo_n_matches')
        .order('queued_at', { ascending: false })
        .limit(100);
      if ($status.value) {
        q = q.eq('status', $status.value);
      } else {
        // Default view excludes 'discarded' — used for cleanup/cancelled rows.
        q = q.neq('status', 'discarded');
      }
      if ($machine.value.trim()) q = q.eq('machine', $machine.value.trim());
      if ($label.value.trim()) q = q.ilike('label', `%${$label.value.trim()}%`);
      const { data, error } = await q;
      if (error) { $runs.innerHTML = `<div class="error">error: ${esc(error.message)}</div>`; return; }
      if (data.length === 0) { $runs.innerHTML = `<div class="muted">no matching runs</div>`; return; }
      const rows = data.map(r => tr([
        statusPill(r.status),
        `<a href="./run.html?id=${esc(r.id)}">${esc(r.label)}</a>`,
        `<span class="mono">${esc(r.model_id)}</span>`,
        `<span class="mono">${esc(r.simulator_id)}</span>`,
        `<span class="mono">${fmtParams(r.result?.param_count)}</span>`,
        `<span class="mono">${gamesPerSec(r.result, r.games_played, r.wall_ms)}</span>`,
        `<span class="mono">${ticksPerMin(r.result?.steps_per_sec)}</span>`,
        bottleneckPill(r.result?.resource_usage?.bottleneck),
        `<span class="mono">${esc(r.seed || '')}</span>`,
        `<span class="mono">${esc(r.machine)}</span>`,
        fmtDuration(r.wall_ms),
        `<span class="mono">${esc(String(r.result?.updates ?? '—'))}</span>`,
        esc(String(r.games_played ?? '—')),
        fmtPct(r.result?.rate),
        `<span class="mono">${fmtElo(r.elo_score, r.elo_n_matches)}</span>`,
        `<span class="muted">${fmtTime(r.queued_at)}</span>`,
      ]));
      $runs.innerHTML = `
        <table>
          <thead><tr>
            <th>status</th><th>label</th><th>model</th><th>sim</th><th>params</th>
            <th>g/s</th><th>ticks/min</th><th>bottleneck</th>
            <th>seed</th><th>machine</th><th>wall</th><th>upd</th><th>games</th><th>rate</th><th>Elo (n)</th><th>queued</th>
          </tr></thead>
          <tbody>${rows.join('')}</tbody>
        </table>
        <div class="muted small" style="margin-top:10px;">${data.length} row${data.length === 1 ? '' : 's'}</div>`;
    }

    function loadAndPersist() {
      writeHashState();
      return load();
    }
    $refresh.addEventListener('click', loadAndPersist);
    $status.addEventListener('change', loadAndPersist);
    [$machine, $label].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') loadAndPersist(); }));

    // Initial load — render then restore scroll position. The two-frame
    // delay covers async paint after the table HTML is set.
    load()
      .then(() => {
        const y = parseInt(sessionStorage.getItem(SCROLL_KEY) || '0', 10);
        if (y > 0) {
          requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, y)));
        }
      })
      .catch(e => $runs.innerHTML = `<div class="error">${esc(e.message)}</div>`);
  </script>
</body>
</html>
