<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mushroom Wars v2 — Dashboard</title>
  <link rel="stylesheet" href="lib/style.css">
</head>
<body>
  <header>
    <h1>Mushroom Wars v2</h1>
    <nav>
      <a href="./index.html">Overview</a>
      <a href="./runs.html">Runs</a>
      <a href="./models.html">Models</a>
      <a href="./elo.html">Leaderboard</a>
      <a href="./training.html">Training</a>
      <a href="./replays.html">Replays</a>
      <a href="./play.html">Play</a>
    </nav>
  </header>

  <main>
    <h2>Champion</h2>
    <div class="card" id="champion">
      <div class="muted">Loading…</div>
    </div>

    <h2>Status</h2>
    <div class="grid" id="stats">
      <div class="card"><div class="stat-label">Loading…</div></div>
    </div>

    <h2>Workers</h2>
    <div class="card" id="workers">
      <div class="muted">Loading…</div>
    </div>

    <h2>Runs</h2>
    <div class="card" id="run-tabs">
      <div style="display:flex; gap:8px; margin-bottom:12px; border-bottom:1px solid var(--border); padding-bottom:8px;">
        <button class="tab-btn active" data-tab="completed"
                style="background:var(--accent); color:#000; border:0; padding:6px 14px; border-radius:6px; cursor:pointer;">
          Completed <span class="muted small" id="completed-count"></span>
        </button>
        <button class="tab-btn" data-tab="upcoming"
                style="background:var(--bg-card); color:var(--fg); border:1px solid var(--border); padding:6px 14px; border-radius:6px; cursor:pointer;">
          Upcoming <span class="muted small" id="upcoming-count"></span>
        </button>
      </div>
      <div id="tab-completed"><div class="muted">Loading…</div></div>
      <div id="tab-upcoming" style="display:none;"><div class="muted">Loading…</div></div>
    </div>
  </main>

  <script type="module">
    import { sb } from './lib/supabase.js';
    import { fmtTime, fmtDuration, fmtPct, esc, statusPill, tr,
             fmtElo, ticksPerMin, totalTicks, fmtBig } from './lib/ui.js';

    const $stats     = document.getElementById('stats');
    const $workers   = document.getElementById('workers');
    const $champion  = document.getElementById('champion');
    const $tabCompleted = document.getElementById('tab-completed');
    const $tabUpcoming  = document.getElementById('tab-upcoming');
    const $countCompleted = document.getElementById('completed-count');
    const $countUpcoming  = document.getElementById('upcoming-count');

    // Tab switching.
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-tab');
        document.querySelectorAll('.tab-btn').forEach(b => {
          const isActive = b === btn;
          b.classList.toggle('active', isActive);
          b.style.background = isActive ? 'var(--accent)' : 'var(--bg-card)';
          b.style.color      = isActive ? '#000' : 'var(--fg)';
          b.style.border     = isActive ? '0' : '1px solid var(--border)';
        });
        $tabCompleted.style.display = tab === 'completed' ? '' : 'none';
        $tabUpcoming.style.display  = tab === 'upcoming'  ? '' : 'none';
      });
    });

    // Friendly labels for the two known machines. Anything else still shows
    // with its raw hostname.
    const MACHINE_LABEL = {
      'Pauls-MacBook-Air.local': 'Mac',
      'PaulLinux':               'Linux (PC)',
    };

    async function loadWorkers() {
      const { data, error } = await sb
        .from('worker_state')
        .select('machine, paused, matches_only, updated_at')
        .order('machine');
      if (error) {
        $workers.innerHTML = `<div class="error">error: ${esc(error.message)}</div>`;
        return;
      }
      if (!data.length) {
        $workers.innerHTML = `<div class="muted">no workers seen yet — start one and refresh</div>`;
        return;
      }
      const modeOf = w => w.paused ? 'off' : (w.matches_only ? 'matches' : 'full');
      const descOf = m => m === 'off' ? 'paused' : m === 'matches' ? 'matches only' : 'taking jobs';
      const dotOf  = m => m === 'off' ? 'off' : 'on';
      $workers.innerHTML = data.map(w => {
        const label = MACHINE_LABEL[w.machine] ?? w.machine;
        const mode = modeOf(w);
        const btn = (m, target, cls) =>
          `<button data-machine="${esc(w.machine)}" data-target="${target}" class="${cls}"${m===target?' disabled':''}>${target==='full'?'Full':target==='matches'?'Matches only':'Off'}</button>`;
        return `<div class="worker-row">
          <span class="worker-dot ${dotOf(mode)}"></span>
          <strong>${esc(label)}</strong>
          <span class="muted mono">${esc(w.machine)}</span>
          <span class="muted">${descOf(mode)}</span>
          <span class="worker-btns">
            ${btn(mode,'full','btn-primary')}
            ${btn(mode,'matches','btn-primary')}
            ${btn(mode,'off','btn-danger')}
          </span>
          <span class="muted small">updated ${fmtTime(w.updated_at)}</span>
        </div>`;
      }).join('');
      $workers.querySelectorAll('button[data-machine]').forEach(b => {
        b.addEventListener('click', async () => {
          const m = b.getAttribute('data-machine');
          const target = b.getAttribute('data-target');
          const paused = target === 'off';
          const matches_only = target === 'matches';
          b.disabled = true;
          const { error } = await sb.from('worker_state')
            .update({ paused, matches_only, updated_at: new Date().toISOString() })
            .eq('machine', m);
          if (error) { alert(error.message); b.disabled = false; return; }
          loadWorkers();
        });
      });
    }

    async function loadChampion() {
      // Top run by Elo (with at least 3 matches) — that's the cron-agent's
      // champion-of-record. Falls back to "highest result.rate done" if no
      // run has been Elo-rated yet.
      const { data: top, error } = await sb
        .from('runs')
        .select('id, label, model_id, simulator_id, machine, hyperparams, result, elo_score, elo_n_matches, wall_ms, games_played, finished_at')
        .eq('status', 'done')
        .gte('elo_n_matches', 3)
        .order('elo_score', { ascending: false })
        .limit(1);
      if (error) {
        $champion.innerHTML = `<div class="error">error: ${esc(error.message)}</div>`;
        return;
      }
      let r = top && top[0];
      if (!r) {
        // Bootstrap: no Elo champ yet; show top by result.rate.
        const fallback = await sb
          .from('runs')
          .select('id, label, model_id, simulator_id, machine, hyperparams, result, elo_score, elo_n_matches, wall_ms, games_played, finished_at')
          .eq('status', 'done')
          .order('result->rate', { ascending: false, nullsFirst: false })
          .limit(1);
        if (fallback.error || !fallback.data || !fallback.data.length) {
          $champion.innerHTML = `<div class="muted">no done runs yet</div>`;
          return;
        }
        r = fallback.data[0];
      }
      const sps  = r.result?.steps_per_sec;
      const tt   = totalTicks(r.result, r.hyperparams);
      const rate = r.result?.rate;
      $champion.innerHTML = `
        <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:center;">
          <div>
            <div class="stat-label">leader</div>
            <div><a href="./run.html?id=${esc(r.id)}"><strong>${esc(r.label)}</strong></a></div>
            <div class="muted small">${esc(r.model_id)} · ${esc(r.simulator_id)}</div>
          </div>
          <div><div class="stat-label">Elo</div><div class="stat">${fmtElo(r.elo_score, r.elo_n_matches)}</div></div>
          <div><div class="stat-label">rate</div><div class="stat">${fmtPct(rate)}</div></div>
          <div><div class="stat-label">updates</div><div class="stat">${esc(String(r.result?.updates ?? '—'))}</div></div>
          <div><div class="stat-label">games</div><div class="stat">${(r.games_played ?? 0).toLocaleString()}</div></div>
          <div><div class="stat-label">ticks/min</div><div class="stat">${ticksPerMin(sps)}</div></div>
          <div><div class="stat-label">train time</div><div class="stat">${fmtDuration(r.wall_ms)}</div></div>
          <div><div class="stat-label">total ticks</div><div class="stat">${fmtBig(tt)}</div></div>
        </div>
      `;
    }

    async function loadStats() {
      const { data: doneRuns, error } = await sb
        .from('runs')
        .select('games_played, wall_ms, hyperparams, result')
        .eq('status', 'done');
      if (error) {
        $stats.innerHTML = `<div class="card error">error: ${esc(error.message)}</div>`;
        return;
      }

      let totalGames = 0, totalWallMs = 0, totalTicksAll = 0, sumStepsPerSec = 0, sumStepsCount = 0;
      for (const r of doneRuns) {
        totalGames   += (r.games_played ?? 0);
        totalWallMs  += (r.wall_ms ?? 0);
        const tt = totalTicks(r.result, r.hyperparams);
        if (tt) totalTicksAll += tt;
        const sps = r.result?.steps_per_sec;
        if (sps != null) { sumStepsPerSec += sps; sumStepsCount++; }
      }
      const avgGpm = totalWallMs > 0 ? (totalGames / (totalWallMs / 60000)) : 0;
      const avgTpm = sumStepsCount > 0 ? (sumStepsPerSec / sumStepsCount) * 60 : 0;

      const cells = [
        ['games trained',     totalGames.toLocaleString()],
        ['total ticks',       fmtBig(totalTicksAll)],
        ['avg games/min',     avgGpm.toFixed(0)],
        ['avg ticks/min',     fmtBig(Math.round(avgTpm))],
        ['total runtime',     fmtDuration(totalWallMs)],
      ];
      $stats.innerHTML = cells.map(([label, v]) =>
        `<div class="card"><div class="stat">${typeof v === 'string' && v.startsWith('<') ? v : esc(String(v))}</div><div class="stat-label">${esc(label)}</div></div>`
      ).join('');
    }

    async function loadCompleted() {
      // Done + failed runs, most recent first.
      const { data, error } = await sb
        .from('runs')
        .select('id, label, status, machine, model_id, simulator_id, wall_ms, queued_at, finished_at, result, hyperparams, elo_score, elo_n_matches')
        .in('status', ['done', 'failed'])
        .order('finished_at', { ascending: false, nullsFirst: false })
        .limit(30);
      if (error) {
        $tabCompleted.innerHTML = `<div class="error">error: ${esc(error.message)}</div>`;
        return;
      }
      $countCompleted.textContent = data.length ? `(${data.length})` : '';
      if (!data.length) {
        $tabCompleted.innerHTML = `<div class="muted">no completed runs yet</div>`;
        return;
      }
      const rows = data.map(r => {
        const sps = r.result?.steps_per_sec;
        return tr([
          statusPill(r.status),
          `<a href="./run.html?id=${esc(r.id)}">${esc(r.label)}</a>`,
          `<span class="mono">${esc(r.model_id)}</span>`,
          `<span class="mono small">${esc(r.simulator_id ?? '')}</span>`,
          `<span class="mono">${esc(r.machine ?? '')}</span>`,
          fmtDuration(r.wall_ms),
          `<span class="mono">${esc(String(r.result?.updates ?? '—'))}</span>`,
          fmtPct(r.result?.rate),
          `<span class="mono">${fmtElo(r.elo_score, r.elo_n_matches)}</span>`,
          `<span class="mono">${ticksPerMin(sps)}</span>`,
          `<span class="muted">${fmtTime(r.finished_at ?? r.queued_at)}</span>`,
        ]);
      });
      $tabCompleted.innerHTML = `
        <table>
          <thead><tr>
            <th>status</th><th>label</th><th>model</th><th>sim</th><th>machine</th>
            <th>wall</th><th>updates</th><th>rate</th><th>Elo (n)</th><th>ticks/min</th><th>finished</th>
          </tr></thead>
          <tbody>${rows.join('')}</tbody>
        </table>`;
    }

    async function loadUpcoming() {
      // Running + queued runs.
      const { data, error } = await sb
        .from('runs')
        .select('id, label, status, machine, model_id, simulator_id, wall_ms, budget_ms, queued_at, started_at, hyperparams')
        .in('status', ['running', 'queued'])
        .order('queued_at', { ascending: true })
        .limit(40);
      if (error) {
        $tabUpcoming.innerHTML = `<div class="error">error: ${esc(error.message)}</div>`;
        return;
      }
      $countUpcoming.textContent = data.length ? `(${data.length})` : '';
      if (!data.length) {
        $tabUpcoming.innerHTML = `<div class="muted">no upcoming runs queued</div>`;
        return;
      }
      const rows = data.map(r => {
        const lvl = r.hyperparams?.level_name ?? '—';
        const opp = r.hyperparams?.opponent_name ?? 'random_legal';
        const K   = r.hyperparams?.action_repeat ?? 1;
        const budget = r.budget_ms ? fmtDuration(r.budget_ms) : '—';
        return tr([
          statusPill(r.status),
          `<a href="./run.html?id=${esc(r.id)}">${esc(r.label)}</a>`,
          `<span class="mono small">${esc(r.simulator_id ?? '')}</span>`,
          `<span class="mono">${esc(lvl)}</span>`,
          `<span class="mono">K=${K}</span>`,
          `<span class="mono">${esc(opp)}</span>`,
          `<span class="mono">${budget}</span>`,
          `<span class="muted">${r.started_at ? fmtTime(r.started_at) : '—'}</span>`,
          `<span class="muted">${fmtTime(r.queued_at)}</span>`,
        ]);
      });
      $tabUpcoming.innerHTML = `
        <table>
          <thead><tr>
            <th>status</th><th>label</th><th>sim</th><th>level</th><th>K</th>
            <th>opponent</th><th>budget</th><th>started</th><th>queued</th>
          </tr></thead>
          <tbody>${rows.join('')}</tbody>
        </table>`;
    }

    loadChampion().catch(e => $champion.innerHTML = `<div class="error">${esc(e.message)}</div>`);
    loadStats().catch(e => $stats.innerHTML  = `<div class="card error">${esc(e.message)}</div>`);
    loadWorkers().catch(e => $workers.innerHTML = `<div class="error">${esc(e.message)}</div>`);
    loadCompleted().catch(e => $tabCompleted.innerHTML = `<div class="error">${esc(e.message)}</div>`);
    loadUpcoming().catch(e => $tabUpcoming.innerHTML = `<div class="error">${esc(e.message)}</div>`);
  </script>
</body>
</html>
