<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mushroom Wars v2 — Dashboard</title>
  <link rel="stylesheet" href="lib/style.css">
</head>
<body>
  <header>
    <h1>Mushroom Wars v2</h1>
    <nav>
      <a href="./index.html">Overview</a>
      <a href="./runs.html">Runs</a>
      <a href="./models.html">Models</a>
      <a href="./leaderboard.html">Leaderboard</a>
    </nav>
  </header>

  <main>
    <h2>Status</h2>
    <div class="grid" id="stats">
      <div class="card"><div class="stat-label">Loading…</div></div>
    </div>

    <h2>Recent runs</h2>
    <div class="card" id="recent-runs">
      <div class="muted">Loading…</div>
    </div>
  </main>

  <script type="module">
    import { sb } from './lib/supabase.js';
    import { fmtTime, fmtDuration, fmtPct, esc, statusPill, tr } from './lib/ui.js';

    const $stats  = document.getElementById('stats');
    const $recent = document.getElementById('recent-runs');

    async function loadStats() {
      const [runs, models, sims, doneRuns] = await Promise.all([
        sb.from('runs').select('status', { count: 'exact', head: false }),
        sb.from('models').select('id', { count: 'exact', head: true }),
        sb.from('simulators').select('id', { count: 'exact', head: true }),
        sb.from('runs').select('games_played, wall_ms').eq('status', 'done'),
      ]);
      if (runs.error || models.error || sims.error || doneRuns.error) {
        $stats.innerHTML = `<div class="card error">error: ${esc(runs.error?.message ?? models.error?.message ?? sims.error?.message ?? doneRuns.error?.message)}</div>`;
        return;
      }
      const byStatus = {};
      for (const r of runs.data) byStatus[r.status] = (byStatus[r.status] || 0) + 1;

      // Aggregates over completed runs.
      let totalGames = 0, totalWallMs = 0;
      for (const r of doneRuns.data) {
        totalGames   += (r.games_played ?? 0);
        totalWallMs  += (r.wall_ms ?? 0);
      }
      const avgGpm = totalWallMs > 0 ? (totalGames / (totalWallMs / 60000)) : 0;

      const cells = [
        ['models',            models.count],
        ['simulators',        sims.count],
        ['runs total',        runs.count],
        ['queued',            byStatus.queued  || 0],
        ['running',           byStatus.running || 0],
        ['done',              byStatus.done    || 0],
        ['failed',            byStatus.failed  || 0],
        ['games trained',     totalGames.toLocaleString()],
        ['avg games/min',     avgGpm.toFixed(0)],
        ['total train time',  fmtDuration(totalWallMs)],
      ];
      $stats.innerHTML = cells.map(([label, v]) =>
        `<div class="card"><div class="stat">${esc(String(v))}</div><div class="stat-label">${esc(label)}</div></div>`
      ).join('');
    }

    async function loadRecentRuns() {
      const { data, error } = await sb
        .from('runs')
        .select('id, label, status, machine, model_id, wall_ms, queued_at, result')
        .order('queued_at', { ascending: false })
        .limit(15);
      if (error) {
        $recent.innerHTML = `<div class="error">error: ${esc(error.message)}</div>`;
        return;
      }
      if (data.length === 0) {
        $recent.innerHTML = `<div class="muted">no runs yet — push one with <span class="inline-code">python cli/push_experiments.py</span></div>`;
        return;
      }
      const rows = data.map(r => tr([
        statusPill(r.status),
        `<a href="./run.html?id=${esc(r.id)}">${esc(r.label)}</a>`,
        `<span class="mono">${esc(r.model_id)}</span>`,
        `<span class="mono">${esc(r.machine)}</span>`,
        fmtDuration(r.wall_ms),
        fmtPct(r.result?.rate),
        `<span class="muted">${fmtTime(r.queued_at)}</span>`,
      ]));
      $recent.innerHTML = `
        <table>
          <thead><tr>
            <th>status</th><th>label</th><th>model</th><th>machine</th>
            <th>wall</th><th>rate</th><th>queued</th>
          </tr></thead>
          <tbody>${rows.join('')}</tbody>
        </table>`;
    }

    loadStats().catch(e => $stats.innerHTML  = `<div class="card error">${esc(e.message)}</div>`);
    loadRecentRuns().catch(e => $recent.innerHTML = `<div class="error">${esc(e.message)}</div>`);
  </script>
</body>
</html>
