<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Elo leaderboard — Mushroom Wars v2</title>
  <link rel="stylesheet" href="lib/style.css">
  <style>
    .matrix { border-collapse: collapse; font-size: 11px; }
    .matrix th, .matrix td { border: 1px solid var(--border); padding: 4px 6px; text-align: center; min-width: 42px; }
    .matrix th { background: #0d0f14; font-weight: 500; }
    .matrix td.diag { background: #1a1e28; color: var(--fg-muted); }
    .matrix td.cell { font-family: var(--mono); }
    .win { color: #86efac; }
    .lose { color: #fca5a5; }
    .draw { color: var(--fg-muted); }
  </style>
</head>
<body>
  <header>
    <h1>Mushroom Wars v2</h1>
    <nav>
      <a href="./index.html">Overview</a>
      <a href="./runs.html">Runs</a>
      <a href="./models.html">Models</a>
      <a href="./leaderboard.html">Leaderboard</a>
      <a href="./elo.html">Elo</a>
    </nav>
  </header>

  <main>
    <h2>Elo ranking (head-to-head)</h2>
    <div class="card muted" id="summary">Loading…</div>

    <div class="card" id="ranking">
      <div class="muted">Loading rankings…</div>
    </div>

    <h2>Elo over training time</h2>
    <div class="card">
      <div class="stat-label">each point = one completed run, plotted at its training-start timestamp</div>
      <div style="position:relative; height:320px; margin-top:8px;"><canvas id="chart-history"></canvas></div>
    </div>

    <h2>Pairwise win rates</h2>
    <div class="card" id="matrix">
      <div class="muted">Loading matrix…</div>
    </div>

    <h2>Recent matches</h2>
    <div class="card" id="recent">
      <div class="muted">Loading matches…</div>
    </div>
  </main>

  <script type="module">
    import { sb } from './lib/supabase.js';
    import { fmtTime, fmtPct, esc, tr } from './lib/ui.js';
    import Chart from 'https://esm.sh/chart.js@4/auto';
    Chart.defaults.color = '#8a93a6';
    Chart.defaults.borderColor = '#262a36';

    const K = 32;           // Elo K-factor
    const INIT_ELO = 1200;  // seed rating for every unrated run

    async function load() {
      // Also fetch queued/running matches for the summary header.
      const [matchesRes, allMatchesRes, runsRes] = await Promise.all([
        sb.from('matches')
          .select('id, model_a_run_id, model_b_run_id, status, summary, games_planned, created_at, finished_at')
          .eq('project', 'mushroom-wars')
          .eq('status', 'done')
          .order('created_at', { ascending: true }),
        sb.from('matches')
          .select('status')
          .eq('project', 'mushroom-wars'),
        sb.from('runs')
          .select('id, label, model_id, queued_at')
          .eq('status', 'done')
          .eq('project', 'mushroom-wars'),
      ]);
      if (allMatchesRes.error) throw allMatchesRes.error;
      if (matchesRes.error) throw matchesRes.error;
      if (runsRes.error) throw runsRes.error;

      const runsById = Object.fromEntries(runsRes.data.map(r => [r.id, r]));
      const matches = matchesRes.data;

      if (matches.length === 0) {
        document.getElementById('summary').textContent =
          'No completed matches yet — queue some with `python cli/queue_eval.py`.';
        for (const id of ['ranking', 'matrix', 'recent']) {
          document.getElementById(id).innerHTML = '<div class="muted">(empty)</div>';
        }
        return;
      }

      // Fetch all per-game rows for these matches (needed for exact game-by-game Elo).
      const matchIds = matches.map(m => m.id);
      const gamesRes = await sb.from('games')
        .select('match_id, game_index, player_1_run_id, player_2_run_id, winner')
        .in('match_id', matchIds);
      if (gamesRes.error) throw gamesRes.error;

      // Group games by match, play matches in chronological order.
      const gamesByMatch = {};
      for (const g of gamesRes.data) {
        (gamesByMatch[g.match_id] = gamesByMatch[g.match_id] || []).push(g);
      }

      // Elo walk.
      const elo = {};
      const played = {};   // games played per run
      const wins  = {};    // total wins per run
      const draws = {};
      const pair = {};     // "a|b" → {wins, losses, draws, games, a, b}

      function getElo(id) {
        if (!(id in elo)) elo[id] = INIT_ELO;
        return elo[id];
      }
      function pairKey(a, b) { return a < b ? `${a}|${b}` : `${b}|${a}`; }

      for (const match of matches) {
        const gs = (gamesByMatch[match.id] || []).sort((x, y) => x.game_index - y.game_index);
        for (const g of gs) {
          // Treat each game as one Elo event; score from P1's perspective.
          const Ra = getElo(g.player_1_run_id);
          const Rb = getElo(g.player_2_run_id);
          const Ea = 1 / (1 + Math.pow(10, (Rb - Ra) / 400));
          let Sa;
          if (g.winner === g.player_1_run_id) Sa = 1;
          else if (g.winner === g.player_2_run_id) Sa = 0;
          else Sa = 0.5;
          elo[g.player_1_run_id] = Ra + K * (Sa - Ea);
          elo[g.player_2_run_id] = Rb + K * ((1 - Sa) - (1 - Ea));

          // Per-run totals.
          for (const rid of [g.player_1_run_id, g.player_2_run_id]) {
            played[rid] = (played[rid] || 0) + 1;
          }
          if (Sa === 1)      wins[g.player_1_run_id] = (wins[g.player_1_run_id] || 0) + 1;
          else if (Sa === 0) wins[g.player_2_run_id] = (wins[g.player_2_run_id] || 0) + 1;
          else              { draws[g.player_1_run_id] = (draws[g.player_1_run_id] || 0) + 1;
                              draws[g.player_2_run_id] = (draws[g.player_2_run_id] || 0) + 1; }

          // Pairwise (undirected a<b).
          const key = pairKey(g.player_1_run_id, g.player_2_run_id);
          if (!pair[key]) pair[key] = { a: key.split('|')[0], b: key.split('|')[1],
                                        a_wins: 0, b_wins: 0, draws: 0, games: 0 };
          const p = pair[key];
          p.games++;
          if (Sa === 0.5) p.draws++;
          else if (g.winner === p.a) p.a_wins++;
          else p.b_wins++;
        }
      }

      const ranked = Object.keys(elo)
        .map(id => ({
          id,
          label: runsById[id]?.label ?? `(${id.slice(0, 8)}…)`,
          model: runsById[id]?.model_id ?? '?',
          elo: elo[id],
          games: played[id] ?? 0,
          wins: wins[id] ?? 0,
          draws: draws[id] ?? 0,
        }))
        .sort((x, y) => y.elo - x.elo);

      // ---- Summary ----
      const mStatus = {};
      for (const r of allMatchesRes.data) mStatus[r.status] = (mStatus[r.status] ?? 0) + 1;
      const inFlight = (mStatus.queued ?? 0) + (mStatus.running ?? 0);
      document.getElementById('summary').innerHTML = `
        ${matches.length} match${matches.length === 1 ? '' : 'es'} scored,
        ${gamesRes.data.length} games total,
        ${ranked.length} run${ranked.length === 1 ? '' : 's'} ranked.
        ${inFlight > 0 ? `<span class="small" style="margin-left:16px;">⟳ ${inFlight} match${inFlight === 1 ? '' : 'es'} still in flight (queued/running)</span>` : ''}
        <span class="small" style="margin-left:16px;">K=${K}, initial Elo=${INIT_ELO}, Elo updated per-game.</span>
      `;

      // ---- Elo-over-training-time scatter ----
      // X axis: run.queued_at (when training started).
      // Y axis: the run's final Elo.
      // Each run that played ≥1 ranked match gets a point.
      const historyPoints = ranked
        .filter(r => runsById[r.id]?.queued_at)
        .map(r => ({
          x: new Date(runsById[r.id].queued_at).getTime(),
          y: r.elo,
          label: r.label,
        }))
        .sort((a, b) => a.x - b.x);
      renderHistoryChart(historyPoints);

      // ---- Ranking table ----
      const $rank = document.getElementById('ranking');
      $rank.innerHTML = `
        <table>
          <thead><tr>
            <th>rank</th><th>Elo</th><th>run</th><th>model</th>
            <th>games</th><th>W</th><th>D</th><th>L</th><th>win%</th>
          </tr></thead>
          <tbody>
            ${ranked.map((r, i) => {
              const losses = r.games - r.wins - r.draws;
              const wr = r.games > 0 ? (r.wins + 0.5 * r.draws) / r.games : null;
              return tr([
                `<span class="mono">#${i + 1}</span>`,
                `<span class="mono"><b>${r.elo.toFixed(0)}</b></span>`,
                `<a href="./run.html?id=${esc(r.id)}">${esc(r.label)}</a>`,
                `<a href="./model.html?id=${esc(r.model)}" class="mono">${esc(r.model)}</a>`,
                String(r.games),
                `<span class="win mono">${r.wins}</span>`,
                `<span class="draw mono">${r.draws}</span>`,
                `<span class="lose mono">${losses}</span>`,
                fmtPct(wr),
              ]);
            }).join('')}
          </tbody>
        </table>`;

      // ---- Pairwise win-rate matrix ----
      // Rows: run index, Cols: opponent index. Cell shows A's win% against B.
      const labels = ranked.map(r => r.label);
      const idToIdx = Object.fromEntries(ranked.map((r, i) => [r.id, i]));
      const grid = Array.from({ length: ranked.length }, () => Array(ranked.length).fill(null));
      for (const p of Object.values(pair)) {
        const i = idToIdx[p.a], j = idToIdx[p.b];
        if (i == null || j == null) continue;
        const a_rate = (p.a_wins + 0.5 * p.draws) / p.games;
        grid[i][j] = a_rate;
        grid[j][i] = 1 - a_rate;
      }

      const $matrix = document.getElementById('matrix');
      if (ranked.length < 2) {
        $matrix.innerHTML = '<div class="muted">need ≥2 runs to build a matrix</div>';
      } else {
        let html = '<table class="matrix"><thead><tr><th></th>';
        for (const l of labels) html += `<th title="${esc(l)}">${esc(l.slice(0, 10))}</th>`;
        html += '</tr></thead><tbody>';
        for (let i = 0; i < ranked.length; i++) {
          html += `<tr><th title="${esc(labels[i])}">${esc(labels[i].slice(0, 18))}</th>`;
          for (let j = 0; j < ranked.length; j++) {
            if (i === j) html += `<td class="diag">—</td>`;
            else if (grid[i][j] == null) html += `<td class="muted">·</td>`;
            else {
              const pct = (grid[i][j] * 100).toFixed(0);
              const cls = grid[i][j] > 0.55 ? 'win' : (grid[i][j] < 0.45 ? 'lose' : 'draw');
              html += `<td class="cell ${cls}">${pct}</td>`;
            }
          }
          html += '</tr>';
        }
        html += '</tbody></table><div class="small muted" style="margin-top:6px;">row vs col, entry = row\'s win rate.</div>';
        $matrix.innerHTML = html;
      }

      // ---- Recent matches ----
      const $recent = document.getElementById('recent');
      const recent = matches.slice(-20).reverse();
      $recent.innerHTML = `
        <table>
          <thead><tr>
            <th>when</th><th>A</th><th>vs</th><th>B</th>
            <th>games</th><th>A wins</th><th>B wins</th><th>draws</th><th>level</th>
          </tr></thead>
          <tbody>
            ${recent.map(m => {
              const s = m.summary || {};
              return tr([
                `<span class="muted">${fmtTime(m.finished_at ?? m.created_at)}</span>`,
                `<a href="./run.html?id=${esc(m.model_a_run_id)}">${esc(runsById[m.model_a_run_id]?.label ?? 'A')}</a>`,
                '<span class="muted">vs</span>',
                `<a href="./run.html?id=${esc(m.model_b_run_id)}">${esc(runsById[m.model_b_run_id]?.label ?? 'B')}</a>`,
                String(m.games_planned ?? '—'),
                `<span class="win mono">${s.wins_a ?? '?'}</span>`,
                `<span class="lose mono">${s.wins_b ?? '?'}</span>`,
                `<span class="draw mono">${s.draws ?? '?'}</span>`,
                `<span class="mono">${esc(s.level_name ?? '?')}</span>`,
              ]);
            }).join('')}
          </tbody>
        </table>`;
    }

    let historyChart = null;
    function renderHistoryChart(points) {
      const canvas = document.getElementById('chart-history');
      if (!canvas) return;
      if (historyChart) historyChart.destroy();
      if (!points.length) {
        canvas.replaceWith(Object.assign(document.createElement('div'),
          { className: 'muted', textContent: 'no ranked runs yet' }));
        return;
      }
      historyChart = new Chart(canvas, {
        type: 'line',
        data: {
          datasets: [{
            label: 'Elo',
            data: points,  // {x, y, label}
            borderColor: '#60a5fa',
            backgroundColor: '#60a5fa',
            borderWidth: 1.5,
            tension: 0.15,
            pointRadius: 4,
            pointHoverRadius: 6,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          parsing: false,
          scales: {
            x: {
              type: 'linear',
              title: { display: true, text: 'training start (UTC)' },
              grid: { color: 'rgba(96,165,250,0.05)' },
              ticks: {
                callback: (v) => new Date(v).toLocaleString(undefined,
                  { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                maxRotation: 0,
                autoSkip: true,
                maxTicksLimit: 8,
              },
            },
            y: {
              title: { display: true, text: 'Elo' },
              grid: { color: 'rgba(96,165,250,0.05)' },
            },
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: (items) => new Date(items[0].parsed.x).toLocaleString(),
                label: (item) => {
                  const p = item.raw;
                  return `${p.label}: Elo ${p.y.toFixed(0)}`;
                },
              },
            },
          },
        },
      });
    }

    load().catch(e => {
      document.getElementById('summary').innerHTML =
        `<span class="error">${esc(e.message)}</span>`;
    });
  </script>
</body>
</html>
