<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Elo leaderboard — Mushroom Wars v2</title>
  <link rel="stylesheet" href="lib/style.css">
</head>
<body>
  <header>
    <h1>Mushroom Wars v2</h1>
    <nav>
      <a href="./index.html">Overview</a>
      <a href="./runs.html">Runs</a>
      <a href="./models.html">Models</a>
      <a href="./elo.html">Leaderboard</a>
      <a href="./training.html">Training</a>
      <a href="./replays.html">Replays</a>
      <a href="./play.html">Play</a>
    </nav>
  </header>

  <main>
    <h2>Elo ranking</h2>
    <div class="card muted" id="summary">Loading…</div>

    <div class="card" id="ranking">
      <div class="muted">Loading rankings…</div>
    </div>

    <h2>Elo over training time</h2>
    <div class="card">
      <div class="stat-label">each point = one rated run, plotted at its training-start time. Y = current Elo.</div>
      <div style="position:relative; height:340px; margin-top:8px;"><canvas id="chart-history"></canvas></div>
    </div>
  </main>

  <script type="module">
    import { sb } from './lib/supabase.js';
    import { fmtTime, fmtDuration, fmtPct, esc, tr,
             fmtElo, ticksPerMin } from './lib/ui.js';
    import Chart from 'https://esm.sh/chart.js@4/auto';
    Chart.defaults.color = '#8a93a6';
    Chart.defaults.borderColor = '#262a36';

    const $summary = document.getElementById('summary');
    const $rank    = document.getElementById('ranking');

    async function load() {
      // Pull every rated run (elo_n_matches >= 1 — keep the unrated 1000s
      // out of the table). Sort by elo desc.
      const { data, error } = await sb
        .from('runs')
        .select('id, label, status, model_id, simulator_id, machine, hyperparams, result, elo_score, elo_n_matches, queued_at, started_at, finished_at, wall_ms')
        .eq('status', 'done')
        .gte('elo_n_matches', 1)
        .order('elo_score', { ascending: false })
        .limit(300);
      if (error) throw error;

      if (!data || !data.length) {
        $summary.textContent = 'No rated runs yet. The worker auto-rates each new run vs random_legal at finish; first ratings will arrive within ~5 min of the next completed run.';
        $rank.innerHTML = '<div class="muted">(empty)</div>';
        renderHistoryChart([]);
        return;
      }

      // Summary stats.
      const elos = data.map(r => r.elo_score).filter(x => x != null);
      const above1k = data.filter(r => r.elo_score > 1000).length;
      const below1k = data.filter(r => r.elo_score < 1000).length;
      $summary.innerHTML = `
        <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:center;">
          <div><div class="stat-label">rated runs</div><div class="stat">${data.length}</div></div>
          <div><div class="stat-label">top Elo</div><div class="stat">${Math.round(Math.max(...elos))}</div></div>
          <div><div class="stat-label">avg Elo</div><div class="stat">${(elos.reduce((a,b)=>a+b,0)/elos.length).toFixed(0)}</div></div>
          <div><div class="stat-label">&gt; 1000</div><div class="stat win">${above1k}</div></div>
          <div><div class="stat-label">&lt; 1000</div><div class="stat lose">${below1k}</div></div>
          <div class="muted small" style="margin-left:auto;">
            Anchor 1000 = pure random_legal play. Each newly-finished run gets
            auto-rated by the worker (3 matches vs random_legal); cron-agent
            adds extra matches against the top-Elo set every 3h. Weekly
            re-rating refreshes the top-30 (Sun 02:13).
          </div>
        </div>
      `;

      // Ranking table.
      const rows = data.map((r, i) => {
        const sps = r.result?.steps_per_sec;
        const hp  = r.hyperparams || {};
        const lvl = hp.level_name ?? '—';
        const upd = r.result?.updates ?? '—';
        const rate = r.result?.rate;
        const eloDelta = r.elo_score - 1000;
        const deltaClass = eloDelta >= 0 ? 'win' : 'lose';
        const deltaSign  = eloDelta >= 0 ? '+' : '';
        return tr([
          `<span class="mono">#${i + 1}</span>`,
          `<span class="mono"><b>${Math.round(r.elo_score)}</b></span>`,
          `<span class="mono ${deltaClass}">${deltaSign}${eloDelta.toFixed(0)}</span>`,
          `<span class="mono small">${r.elo_n_matches}</span>`,
          `<a href="./run.html?id=${esc(r.id)}">${esc(r.label)}</a>`,
          `<span class="mono small">${esc(r.simulator_id ?? '')}</span>`,
          `<a href="./model.html?id=${esc(r.model_id)}" class="mono">${esc(r.model_id)}</a>`,
          `<span class="mono">${esc(lvl)}</span>`,
          `<span class="mono">${esc(String(upd))}</span>`,
          fmtPct(rate),
          fmtDuration(r.wall_ms),
          `<span class="mono">${ticksPerMin(sps)}</span>`,
          `<span class="muted">${fmtTime(r.finished_at ?? r.queued_at)}</span>`,
        ]);
      });

      $rank.innerHTML = `
        <table>
          <thead><tr>
            <th>rank</th><th>Elo</th><th>Δ vs 1000</th><th>matches</th>
            <th>run</th><th>sim</th><th>model</th><th>level</th>
            <th>updates</th><th>rate</th><th>wall</th><th>ticks/min</th><th>finished</th>
          </tr></thead>
          <tbody>${rows.join('')}</tbody>
        </table>
        <div class="muted small" style="margin-top:8px;">
          Δ vs 1000 = Elo distance from the random_legal baseline anchor.
          A 200-point lead means winning ~76% of head-to-heads.
        </div>`;

      // Elo over time scatter — uses queued_at as x, elo_score as y.
      const points = data
        .filter(r => r.queued_at)
        .map(r => ({
          x: new Date(r.queued_at).getTime(),
          y: r.elo_score,
          label: r.label,
        }))
        .sort((a, b) => a.x - b.x);
      renderHistoryChart(points);
    }

    let historyChart = null;
    function renderHistoryChart(points) {
      const canvas = document.getElementById('chart-history');
      if (!canvas) return;
      if (historyChart) historyChart.destroy();
      if (!points.length) {
        canvas.replaceWith(Object.assign(document.createElement('div'),
          { className: 'muted', textContent: 'no rated runs yet' }));
        return;
      }
      historyChart = new Chart(canvas, {
        type: 'line',
        data: {
          datasets: [{
            label: 'Elo',
            data: points,
            borderColor: '#60a5fa',
            backgroundColor: '#60a5fa',
            borderWidth: 1.2,
            tension: 0.0,
            showLine: false,
            pointRadius: 4,
            pointHoverRadius: 7,
          }, {
            // Reference line at 1000 (random_legal anchor).
            label: 'baseline 1000',
            data: points.map(p => ({ x: p.x, y: 1000 })),
            borderColor: '#444',
            borderWidth: 1,
            borderDash: [4, 4],
            pointRadius: 0,
            showLine: true,
            tension: 0,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          parsing: false,
          scales: {
            x: {
              type: 'linear',
              title: { display: true, text: 'training start' },
              grid: { color: 'rgba(96,165,250,0.05)' },
              ticks: {
                callback: (v) => new Date(v).toLocaleString(undefined,
                  { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                maxRotation: 0,
                autoSkip: true,
                maxTicksLimit: 8,
              },
            },
            y: {
              title: { display: true, text: 'Elo' },
              grid: { color: 'rgba(96,165,250,0.05)' },
            },
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: (items) => new Date(items[0].parsed.x).toLocaleString(),
                label: (item) => {
                  const p = item.raw;
                  if (!p.label) return null;
                  return `${p.label}: Elo ${Math.round(p.y)}`;
                },
              },
            },
          },
        },
      });
    }

    load().catch(e => {
      $summary.innerHTML = `<span class="error">${esc(e.message)}</span>`;
    });
  </script>
</body>
</html>
