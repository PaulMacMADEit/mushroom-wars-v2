# Training-level config — single source of truth.
#
# Both the cron-agent (scripts/cron_agent_pulse.py) and the karpathy loop
# (scripts/queue_karp_sweep.py) read level info from THIS file, via
# cli/loop_config.load_levels(). They are required to match — runs queued by
# different schedulers should train on the same distribution so their results
# are directly comparable.
#
# Two ways to specify the level:
#   1. level_name only        — single static level for every env on every reset
#   2. level_name + level_mix — each env independently samples a level on reset;
#                               level_name becomes a label only
#
# When level_mix is set, it must be a {name: weight} dict OR a list of
# [name, weight] pairs. Bare lists of strings DO NOT work — trainer.py:280
# tries float(item[1]) and crashes on string indexing (caught 2026-04-30
# fire 90 first run, ValueError: could not convert string to float: 'a').
#
# Reload cost: zero — both schedulers read fresh from disk each fire.

# 2026-04-30 (PT): graduated to Step 2 — Large Map mix.
#   Step 1 (random_close_4_5, 350×350, 4-5 buildings) peaked at v10.1.01-SmallMap-Base-03
#   (96.7% rate vs random_legal). Now scaling up to test transfer to larger,
#   more varied maps. Same hardcoded opponent (random_legal); the variable is
#   map size + building count, not opponent strength.
#
#   Mix: 4 generators sampled per-env on reset, equal weight. Range 4-24 buildings,
#   full 700x700 map.
level_name: random_4_8  # label only when level_mix is set
level_mix:
  random_4_8: 1.0
  random_6_10: 1.0
  random_8_16: 1.0
  random_16_24: 1.0
