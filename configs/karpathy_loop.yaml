# Karpathy loop configuration
#
# Single source of truth for everything the hourly Karpathy loop reads:
#   - schedule + queue policy
#   - baseline training hyperparams (every PPOConfig field; the cfg around
#     which we sweep)
#   - level distribution (what maps the agent trains on)
#   - opponent selection (what the agent plays against in training rollouts)
#   - sweep axes + cell values (one variable at a time, 3 cells, ~60min)
#
# Edit this file (NOT Python) when you want to change loop behaviour.
# scripts/queue_karp_sweep.py reads it; the loop prompt references it.
# Reload cost: zero — every fire reads fresh from disk.
#
# Field-name rule: every key under baseline_hyperparams: must match a field
# on training/trainer.py:PPOConfig — workers/worker.py:855 filters out
# unknown keys silently, so a typo = silent no-op (caught 2026-04-28
# with `clip_coef` vs the real `clip_range`).

# ---------------------------------------------------------------------------
# Loop schedule (when fires happen, how long each cell runs)
# ---------------------------------------------------------------------------
schedule:
  fire_interval_seconds: 1800     # 30min between Claude-side wakeups
  cell_budget_seconds:   600      # per-cell wall-time → 10min cells (small maps, fast iter)
  max_karp_queue_depth:  6        # skip queueing if >= this many karp-* are pending
  idle_fires_before_stop: 0       # 0 = never stop on idleness

# ---------------------------------------------------------------------------
# Queue housekeeping (what the loop cleans up each fire)
# ---------------------------------------------------------------------------
queue_policy:
  stale_running_minutes:    90    # 'running' for longer than this → mark failed
  protected_label_prefix:   "karpv2-"  # NEW REGIME 2026-04-29: vs-champion + curriculum, no random_legal
  protected_label_patterns: []    # additional regexes never to cancel

# ---------------------------------------------------------------------------
# Model + simulator IDs (rarely change)
# ---------------------------------------------------------------------------
model:
  model_id:     "v9.0-1024"      # body width 1024, factored heads
  simulator_id: "sim-v1.3"

# ---------------------------------------------------------------------------
# Training opponent — who does the agent play against during rollouts?
# ---------------------------------------------------------------------------
# `name` ∈ {random_legal, neural, noop, latest_champion}
#   random_legal     — fast on-device JAX path; uniform-random over legal moves
#   neural           — fixed neural opponent loaded at run start (slow w/ fused)
#   noop             — opponent does nothing
#   latest_champion  — sugar; queue_karp_sweep.py resolves to opponent_name=neural
#                      with opponent_kwargs.opponent_run_id = champions[0].source_run_id
training_opponent:
  name: "latest_champion"         # 2026-04-29 regime change: NO random_legal. Train vs the live champion always.
  kwargs: {}                      # queue_karp_sweep.py auto-resolves to neural+champion's run_id

# ---------------------------------------------------------------------------
# Baseline PPO hyperparameters
#
# Every key here passes through to training/trainer.py:PPOConfig. Sweeps
# overlay one key per cell on top of this. Add a key here to make it
# sweepable later without code changes.
# ---------------------------------------------------------------------------
baseline_hyperparams:
  # ----- Rollout shape -----
  n_envs:        1024              # parallel envs in the vec env
  vec_mode:      "sync"            # sync (in-process) or async (subprocs)
  rollout_steps: 64                # per-env steps per update; total samples = n_envs*rollout_steps

  # ----- Engine -----
  sim_backend:   "jax"             # jax (fast) | numpy (only path for self_play=true per-env opponents)
  fused_rollout: true              # only valid when self_play=false
  action_repeat: 2                 # K: env ticks per agent decision under fused

  # ----- PPO update -----
  update_epochs:  4                # PPO inner-loop passes over the rollout buffer
  minibatch_size: 512              # samples per SGD step
  lr:             3.0e-4
  gamma:          0.97             # discount factor
  gae_lambda:     0.95             # GAE smoothing
  clip_range:     0.2              # PPO clipped-surrogate epsilon
  value_coef:     0.5              # weight on critic MSE
  entropy_coef:   0.01             # exploration bonus
  max_grad_norm:  0.5              # gradient clipping

  # ----- Observation normalisation -----
  normalize_obs:  true             # Welford running mean/std on obs
  obs_clip:       10.0             # clip normalized obs at ±this; null disables

  # ----- Self-play (mutually exclusive with sim_backend=jax + fused) -----
  self_play:        false
  snapshot_every:   10             # update count between pool snapshots
  pool_max_size:    20             # evict oldest beyond this
  latest_bias:      0.8            # P(env samples latest snapshot) when self_play=true
  initial_opponent: "random_legal"

  # ----- Cross-lineage / PFSP archive sampling (training-time) -----
  # Only consulted when self_play=true. Bench-eval-time PFSP is independent.
  leaderboard_bias:   0.30          # P(env draws from champion archive per snapshot)
  leaderboard_source: "pfsp"        # "pfsp" | "elo" (legacy)
  leaderboard_top_k:  10

  # ----- Reward shape -----
  # See sim/config.py REWARD_*_BY_VERSION for the table.
  #   v1.2 (0): legacy; capture 0.10, win 1.0, no speed bonus
  #   v1.3 (1): 5x WIN/LOSE, halved capture, draw -0.5, 4x speed bonus
  #   v1.4 (2): v1.3 + per-tick shaping for buildings_owned + units_held deltas
  # `reward_version` is canonical (overrides reward_v13 when ≥0).
  # 2026-04-29: v14 baked as new regime default — produces active varied policies
  # (fire 55: 19/24 wins, full 4-action vocabulary in losses).
  reward_v13: true
  reward_version: 2

  # ----- Level distribution (per-env sampling on each reset) -----
  # 2026-04-29 curriculum reset: 4-5 building close-map games only. Master
  # the basics first, ramp up later. Close map = 350x350 (vs 700x700 default)
  # = ~half travel time = many more episodes per wall-second. Fast iteration.
  level_name: "random_close_4_5"
  # level_mix removed — single level only at this curriculum stage.

# ---------------------------------------------------------------------------
# Sweep axes (round-robin, one per fire)
# ---------------------------------------------------------------------------
# Each axis name MUST be a key under baseline_hyperparams above (or a
# nested path the loader handles). Cell values overlay the baseline.
sweep_axes:
  - axis: "entropy_coef"
    cells:
      - { label: "lo",  value: 0.003 }
      - { label: "mid", value: 0.01  }
      - { label: "hi",  value: 0.03  }

  - axis: "lr"
    cells:
      - { label: "lo",  value: 1.0e-4 }
      - { label: "mid", value: 3.0e-4 }
      - { label: "hi",  value: 1.0e-3 }

  - axis: "rollout_steps"
    cells:
      - { label: "lo",  value: 32  }
      - { label: "mid", value: 64  }
      - { label: "hi",  value: 128 }

  - axis: "n_envs"
    cells:
      - { label: "lo",  value: 512  }
      - { label: "mid", value: 1024 }
      - { label: "hi",  value: 2048 }

  - axis: "gamma"
    cells:
      - { label: "lo",  value: 0.95 }
      - { label: "mid", value: 0.97 }
      - { label: "hi",  value: 0.99 }

  - axis: "gae_lambda"
    cells:
      - { label: "lo",  value: 0.90 }
      - { label: "mid", value: 0.95 }
      - { label: "hi",  value: 0.98 }

  - axis: "clip_range"               # was wrongly named clip_coef; PPOConfig uses clip_range
    cells:
      - { label: "lo",  value: 0.10 }
      - { label: "mid", value: 0.20 }
      - { label: "hi",  value: 0.30 }

  - axis: "update_epochs"
    cells:
      - { label: "lo",  value: 2 }
      - { label: "mid", value: 4 }
      - { label: "hi",  value: 8 }

  - axis: "minibatch_size"
    cells:
      - { label: "lo",  value: 256  }
      - { label: "mid", value: 512  }
      - { label: "hi",  value: 1024 }

  - axis: "value_coef"
    cells:
      - { label: "lo",  value: 0.25 }
      - { label: "mid", value: 0.50 }
      - { label: "hi",  value: 1.00 }

  - axis: "max_grad_norm"
    cells:
      - { label: "lo",  value: 0.25 }
      - { label: "mid", value: 0.50 }
      - { label: "hi",  value: 1.00 }

  # 2-cell A/B (control vs treatment). v1.3 = current baseline (terminal-only
  # rewards + speed bonus). v1.4 = + per-tick shaping for buildings/units
  # deltas, designed to break mutual-noop equilibrium under random_legal
  # (KARPATHY_LOG fire 19-20). Override `reward_version` directly; baseline
  # `reward_v13: true` is overridden by reward_version when ≥0.
  - axis: "reward_version"
    cells:
      - { label: "lo",  value: 1 }     # v1.3 control
      - { label: "hi",  value: 2 }     # v1.4 treatment
