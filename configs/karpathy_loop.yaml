# Karpathy loop configuration
#
# Single source of truth for everything the hourly Karpathy loop reads:
#   - schedule + queue policy
#   - baseline training hyperparams (every PPOConfig field; the cfg around
#     which we sweep)
#   - level distribution (what maps the agent trains on)
#   - opponent selection (what the agent plays against in training rollouts)
#   - sweep axes + cell values (one variable at a time, 3 cells, ~60min)
#
# Edit this file (NOT Python) when you want to change loop behaviour.
# scripts/queue_karp_sweep.py reads it; the loop prompt references it.
# Reload cost: zero — every fire reads fresh from disk.
#
# Field-name rule: every key under baseline_hyperparams: must match a field
# on training/trainer.py:PPOConfig — workers/worker.py:855 filters out
# unknown keys silently, so a typo = silent no-op (caught 2026-04-28
# with `clip_coef` vs the real `clip_range`).

# ---------------------------------------------------------------------------
# Loop schedule (when fires happen, how long each cell runs)
# ---------------------------------------------------------------------------
schedule:
  fire_interval_seconds: 1800     # 30min between Claude-side wakeups
  cell_budget_seconds:   300      # 2026-04-29 fire 61: 5-min cells. Tight iteration loop.
                                  # Smaller maps, fewer params per game = should learn fast.
                                  # Adjust update count via rollout_steps, NOT cell length.
  max_karp_queue_depth:  6        # skip queueing if >= this many karp-* are pending
  idle_fires_before_stop: 0       # 0 = never stop on idleness

# ---------------------------------------------------------------------------
# Queue housekeeping (what the loop cleans up each fire)
# ---------------------------------------------------------------------------
queue_policy:
  stale_running_minutes:    90    # 'running' for longer than this → mark failed
  protected_label_prefix:   "karpv2-"             # legacy karp prefix
  protected_label_patterns:                       # new format `v10.1.<exp>-<desc>`
    - "^v\\d+(?:\\.\\d+)+-"

# ---------------------------------------------------------------------------
# Model + simulator IDs + curriculum step
# ---------------------------------------------------------------------------
# Run-label convention (2026-04-30 onward):
#   {version_prefix}.{exp:02d}-{MajorChange}-{Variable}-{cell}     (sweeps)
#   {version_prefix}.{exp:02d}-{MajorChange}-{Kind}-{NN:02d}       (chains)
#
# Two distinct fields:
#   `model_id`        - FK to the `models` table; the trained architecture
#                       (e.g. v10-1024 = encoder v10, body=1024). Stable
#                       across curriculum steps that share the architecture.
#   `version_prefix`  - label prefix encoding (model_major).(curriculum_step)
#                       e.g. "v10.2" = v10 architecture, Step 2 curriculum.
#                       Bump the .step component when starting a new step.
#   `major_change`    - human-readable descriptor of what changed in this step
#                       (LargeMap, ChampOpp, ...). Goes into every label.
model:
  model_id:       "v12.0"        # 2026-05-01: clean break from v10/v11.
                                 # Set-transformer encoder + pointer heads
                                 # over 8-building / 4-group slot tokens.
                                 # 2 send pcts (50/100) + noop. ~1.2M params.
  simulator_id:   "sim-v1.4"     # MAX_BUILDING_SLOTS=8, MAX_UNIT_GROUP_SLOTS=4,
                                 # SEND_PERCENTAGES=(50,100). v12 sim contract.
  version_prefix: "v12.0"        # Step 0 (bootstrap). Bump .step on curriculum graduation.
  major_change:   "Bootstrap"    # Goes into every label + description

# ---------------------------------------------------------------------------
# Training opponent — who does the agent play against during rollouts?
# ---------------------------------------------------------------------------
# `name` ∈ {random_legal, neural, noop, latest_champion}
#   random_legal     — fast on-device JAX path; uniform-random over legal moves
#   neural           — fixed neural opponent loaded at run start (slow w/ fused)
#   noop             — opponent does nothing
#   latest_champion  — sugar; queue_karp_sweep.py resolves to opponent_name=neural
#                      with opponent_kwargs.opponent_run_id = champions[0].source_run_id
training_opponent:
  # 2026-04-29 fire 65: per-cell random opponent picking from champion archive.
  # Modes:
  #   latest_champion  — most-recent archived champion (single, no diversity)
  #   random_champion  — uniform random from archive per cell
  #   pfsp_champion    — PFSP-weighted random per cell (favours stronger opps)
  #   self_play        — trainer's self_play=true (requires fused_rollout=false)
  #   neural           — explicit run_id in kwargs (legacy)
  #   random_legal     — uniform-random legal moves (no archive). Required during
  #                      v10 bootstrap when the archive only held v9.0 (OBS_DIM=1002)
  #                      checkpoints — incompatible with v10 (1008).
  #
  # 2026-05-01 v12 SELF-PLAY: bootstrap complete (5a772e4b → 88.1%, 260e1051 →
  # 94.4%). Switching to pure self-play — every cell trains against a
  # PFSP-weighted v12 champion. random_legal removed everywhere per Paul.
  name: "pfsp_champion"
  kwargs: {}

# ---------------------------------------------------------------------------
# Baseline PPO hyperparameters
#
# Every key here passes through to training/trainer.py:PPOConfig. Sweeps
# overlay one key per cell on top of this. Add a key here to make it
# sweepable later without code changes.
# ---------------------------------------------------------------------------
baseline_hyperparams:
  # ----- Rollout shape -----
  n_envs:        1800              # 2026-04-30 fire 99: bumped 1024 -> 1800 per Paul.
                                   # cont-03 (Step 1 base) was at 1800; lr sweep at 1024 hit
                                   # 84.4% in 5 min. More parallel diversity should help with
                                   # the level_mix wandering at smaller batches.
  vec_mode:      "sync"            # sync (in-process) or async (subprocs)
  rollout_steps: 8                 # 2026-04-29 fire 61: cut hard from 64 → 8. Aggressive.
                                   # Under v2 (vs-champion @ ~322 sps) with 5-min cells:
                                   # 1024 envs × 8 rs = 8k samples/update.
                                   # 96k env steps / 8k = ~12 updates/cell (was 3 with rs=64).
                                   # Trade-off: smaller rollout = less GAE horizon depth per
                                   # update. Acceptable on close 4-5 building maps where games
                                   # are short anyway.

  # ----- Engine -----
  sim_backend:   "jax"             # jax (fast) | numpy (only path for self_play=true per-env opponents)
  fused_rollout: true              # only valid when self_play=false
  action_repeat: 2                 # K: env ticks per agent decision under fused

  # ----- PPO update -----
  update_epochs:  4                # PPO inner-loop passes over the rollout buffer
  minibatch_size: 512              # samples per SGD step
  lr:             3.0e-3           # 2026-04-30 fire 97: 3× the prior 1e-3. Step 2 chain
                                   # (Base-01..04) showed KL bouncing between 0.002 and 0.275 —
                                   # cumulative-tiny-then-overshoot. Higher lr gives PPO actual
                                   # updates per cell instead of stalling. Sweep [1e-3, 3e-3, 1e-2]
                                   # in fire 97; this baseline is the mid value.
  gamma:          0.99             # discount factor. 2026-04-30 fire 97: bumped 0.97 -> 0.99.
                                   # On Step 2 (mean ep_len ~127 ticks), 0.97^127 = 2% — terminal
                                   # win signal was almost entirely discounted away. 0.99^127 = 28%.
                                   # 37% timeout_rate on Base-04 confirmed the "win finish" gradient
                                   # was anemic; longer-horizon discount restores it.
  gae_lambda:     0.95             # GAE smoothing
  clip_range:     0.2              # PPO clipped-surrogate epsilon
  value_coef:     0.5              # weight on critic MSE
  entropy_coef:   0.01             # exploration bonus
  max_grad_norm:  0.5              # gradient clipping

  # ----- Observation normalisation -----
  normalize_obs:  true             # Welford running mean/std on obs
  obs_clip:       10.0             # clip normalized obs at ±this; null disables

  # ----- Self-play (mutually exclusive with sim_backend=jax + fused) -----
  self_play:        false
  snapshot_every:   10             # update count between pool snapshots
  pool_max_size:    20             # evict oldest beyond this
  latest_bias:      0.8            # P(env samples latest snapshot) when self_play=true
  initial_opponent: "random_legal"

  # ----- Per-update opponent rotation (2026-04-29 fire 65) -----
  # When set to 'rotate_per_update', the trainer picks a random archive
  # member at the start of each PPO update and swaps the opponent callable
  # in-place. ~50ms per swap. Lets a 5-min cell with 12-21 updates train
  # against 12-21 different opponents instead of one. Compatible with
  # fused_rollout=true (single neural opponent path; just hot-swapped each
  # update). Requires worker to download the archive — gated on this AND
  # leaderboard_bias>0 in workers/worker.py.
  #
  # 2026-05-01 v12 SELF-PLAY: rotate every PPO update. Trainer pre-loads the
  # v12 archive into RAM and swaps the opponent each update for variety.
  opponent_pool_mode: "rotate_per_update"

  # ----- Cross-lineage / PFSP archive sampling (training-time) -----
  # Only consulted when self_play=true. Bench-eval-time PFSP is independent.
  # 2026-05-01 v12 SELF-PLAY: pure rotation against the v12 archive.
  leaderboard_bias:   1.0           # 100% pool-sourced (gate for download; rotate_per_update supersedes per-env mixing)
  leaderboard_source: "pfsp"        # "pfsp" | "elo" (legacy)
  leaderboard_top_k:  10

  # ----- Reward shape -----
  # See sim/config.py REWARD_*_BY_VERSION for the table.
  #   v1.2 (0): legacy; capture 0.10, win 1.0, no speed bonus
  #   v1.3 (1): 5x WIN/LOSE, halved capture, draw -0.5, 4x speed bonus
  #   v1.4 (2): v1.3 + per-tick shaping for buildings_owned + units_held deltas
  #   v1.5 (3): v1.4 + asymmetric capture/loss (enemy 4× neutral)
  # `reward_version` is canonical (overrides reward_v13 when ≥0).
  # 2026-04-30 fire 99: bumped to v1.5. v1.4 produced 37% timeout_rate on
  # Step 2 (agent dominates territory but never finishes games). v1.5 gives
  # explicit asymmetric signal: capture from enemy = +0.20 (4× neutral's
  # 0.05), lose to enemy = -0.20 (4× neutral's -0.05). Should attack the
  # "dominate-don't-finish" equilibrium directly.
  reward_v13: true
  reward_version: 4   # 2026-05-01: v1.6 — LOSE -5.0→-7.5 (+50% cost),
                      # DRAW -0.5→-1.25 (+150% cost). v1.5 base + harsher
                      # loss/draw to push past stalemate equilibria.

  # ----- Level distribution -----
  # NOTE: level_name and level_mix are NOT set here. They are read from
  # configs/training_levels.yaml at queue time so cron + karp always agree.
  # cli/loop_config.load() overlays them onto baseline_hyperparams.

# ---------------------------------------------------------------------------
# Sweep axes (round-robin, one per fire)
# ---------------------------------------------------------------------------
# Each axis name MUST be a key under baseline_hyperparams above (or a
# nested path the loader handles). Cell values overlay the baseline.
sweep_axes:
  - axis: "entropy_coef"
    cells:
      - { label: "lo",  value: 0.003 }
      - { label: "mid", value: 0.01  }
      - { label: "hi",  value: 0.03  }

  - axis: "lr"
    cells:
      - { label: "lo",  value: 1.0e-3 }
      - { label: "mid", value: 3.0e-3 }
      - { label: "hi",  value: 1.0e-2 }

  - axis: "rollout_steps"
    cells:
      - { label: "lo",  value: 4   }
      - { label: "mid", value: 8   }   # 2026-04-29 fire 61: matches v2 baseline. Was 32/64/128.
      - { label: "hi",  value: 16  }   # Bigger values would give <2 updates per 5-min cell.

  - axis: "n_envs"
    cells:
      - { label: "lo",  value: 512  }
      - { label: "mid", value: 1024 }
      - { label: "hi",  value: 1536 }   # 2026-04-29: capped from 2048 — that
                                        # OOMs on the 8 GiB GPU. Worker process
                                        # already takes ~7 GiB resident; the
                                        # extra rollout buffer at 2048 envs
                                        # (2x more than 1024) tips it over.

  - axis: "gamma"
    cells:
      - { label: "lo",  value: 0.95 }
      - { label: "mid", value: 0.97 }
      - { label: "hi",  value: 0.99 }

  - axis: "gae_lambda"
    cells:
      - { label: "lo",  value: 0.90 }
      - { label: "mid", value: 0.95 }
      - { label: "hi",  value: 0.98 }

  - axis: "clip_range"               # was wrongly named clip_coef; PPOConfig uses clip_range
    cells:
      - { label: "lo",  value: 0.10 }
      - { label: "mid", value: 0.20 }
      - { label: "hi",  value: 0.30 }

  - axis: "update_epochs"
    cells:
      - { label: "lo",  value: 2 }
      - { label: "mid", value: 4 }
      - { label: "hi",  value: 8 }

  - axis: "minibatch_size"
    cells:
      - { label: "lo",  value: 256  }
      - { label: "mid", value: 512  }
      - { label: "hi",  value: 1024 }

  - axis: "value_coef"
    cells:
      - { label: "lo",  value: 0.25 }
      - { label: "mid", value: 0.50 }
      - { label: "hi",  value: 1.00 }

  - axis: "max_grad_norm"
    cells:
      - { label: "lo",  value: 0.25 }
      - { label: "mid", value: 0.50 }
      - { label: "hi",  value: 1.00 }

  # 2-cell A/B (control vs treatment). v1.3 = current baseline (terminal-only
  # rewards + speed bonus). v1.4 = + per-tick shaping for buildings/units
  # deltas, designed to break mutual-noop equilibrium under random_legal
  # (KARPATHY_LOG fire 19-20). Override `reward_version` directly; baseline
  # `reward_v13: true` is overridden by reward_version when ≥0.
  - axis: "reward_version"
    cells:
      - { label: "lo",  value: 1 }     # v1.3 control
      - { label: "hi",  value: 2 }     # v1.4 treatment
